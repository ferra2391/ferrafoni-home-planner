lass=\"nav\" data-sett=\"1\" aria-label=\"Settimana successiva\">›</button>\n    <span class=\"et\">\n      <b>${breve(lun)} – ${breve(piu(lun, 6))}</b>\n      <span>${corrente ? 'settimana in corso' : (lun < OGGI ? 'settimana conclusa' : 'settimana da venire')}\n      · ${plurale(av.restanti, 'voce da fare', 'voci da fare')}</span>\n    </span>\n    <span style=\"position:relative;display:flex;align-items:center;justify-content:center\">\n      ${anello(av.percento, COLORE, 60)}\n      <b style=\"position:absolute;font-size:.85rem;color:var(--pulizie)\">${av.percento}%</b>\n    </span>\n    ${corrente ? '' : '<button class=\"btn chiaro piccolo\" data-sett=\"0\">Torna a oggi</button>'}\n  </div>`;\n}\n\nfunction vistaChecklist(){\n  const cats = S.categorie('pulizie');\n  const voci = S.S.dati.pulizie.voci;\n\n  if (primaVolta) {\n    primaVolta = false;\n    const prima = cats.find(c => voci.some(v => v.categoria_id === c.id && !S.spunta(v.id)));\n    if (prima) aperti.add(prima.id);\n  }\n\n  const ore = S.S.dati.pulizie.ore.filter(o => o.data >= S.S.settimana && o.data <= iso(piu(new Date(S.S.settimana + 'T00:00:00'), 6)));\n  const totale = ore.reduce((s, o) => s + o.ore, 0);\n\n  return barraSettimana() + `\n    <div class=\"griglia g-lato\">\n      ${riq('Checklist della settimana',\n        cats.map(c => gruppo(c, voci.filter(v => v.categoria_id === c.id))).join(''),\n        { raso: true, classe: 'tinta', colore: COLORE, meta: 'tocca Fatto o Parziale, la data si registra da sola' })}\n      <div class=\"griglia\" style=\"align-content:start\">\n        ${riq('Giorni lavorati',\n          tabella(['Giorno', 'Orario', 'Ore'],\n            ore.length ? ore.map(o => `<tr><td>${esc(new Date(o.data).toLocaleDateString('it-IT',{weekday:'long',day:'numeric'}))}</td>\n              <td class=\"num\">${esc(o.ora_inizio || '')} – ${esc(o.ora_fine || '')}</td>\n              <td class=\"num\">${String(o.ore).replace('.', ',')}</td></tr>`)\n              : [`<tr><td colspan=\"3\">${vuoto('Nessuna giornata registrata')}</td></tr>`]) +\n          `<div style=\"padding:14px 18px;border-top:1px solid var(--linea-tenue)\">\n             <button class=\"btn chiaro pieno\" data-nuova-giornata>Aggiungi giornata</button></div>`,\n          { raso: true, meta: String(totale).replace('.', ',') + ' ore questa settimana' })}\n        ${riq('Note per chi pulisce', `<ul class=\"righe\" style=\"margin:-16px -18px\">\n          <li><span class=\"tx\"><strong>Lenzuola nell'armadio del corridoio</strong><span>Seconda anta, ripiano alto</span></span></li>\n          <li><span class=\"tx\"><strong>Niente candeggina in cucina</strong><span>Solo detergente neutro sul piano in legno</span></span></li>\n          <li><span class=\"tx\"><strong>Camera di Maddie dopo le 15:00</strong><span>Riposino fino alle 14:45</span></span></li>\n        </ul>`)}\n      </div>\n    </div>`;\n}\n\n/* ---------- biancheria ---------- */\n\nfunction vistaBiancheria(){\n  const lista = S.biancheriaConScadenza();\n  const righe = lista.map(b => `\n    <tr>\n      <td><b>${esc(b.nome)}</b><span class=\"sm\">${esc(S.nomePersona(b.persona_id))}</span></td>\n      <td>${b.ogni_giorni === 7 ? 'settimana' : b.ogni_giorni === 14 ? '2 settimane' : b.ogni_giorni + ' giorni'}</td>\n      <td class=\"num\">${gm(b.ultimo_cambio)}</td>\n      <td><span class=\"pill ${b.etichetta.classe}\">${esc(b.etichetta.testo)}</span></td>\n      <td style=\"text-align:right\">\n        <div class=\"riga-azioni\" style=\"justify-content:flex-end;display:inline-flex\">\n          <button class=\"btn piccolo\" style=\"background:var(--pulizie)\" data-cambio=\"${b.id}\">Cambiato</button>\n          <button data-storico=\"${b.id}\" title=\"Storico\">🕐</button>\n          <button data-mod-bianc=\"${b.id}\" title=\"Modifica\">✎</button>\n        </div>\n      </td>\n    </tr>`);\n\n  const scorte = lista.filter(b => b.scorta <= b.scorta_minima);\n\n  return `<div class=\"griglia g-lato\">\n    ${riq('Cambi biancheria', tabella(['Cosa', 'Ogni', 'Ultimo cambio', 'Stato', ''], righe) +\n        `<div style=\"padding:14px 18px;border-top:1px solid var(--linea-tenue)\">\n           <button class=\"btn chiaro pieno\" data-nuovo-bianc>Aggiungi articolo</button></div>`,\n      { raso: true, classe: 'tinta', colore: COLORE, meta: 'in rosso quelli da fare adesso' })}\n    <div class=\"griglia\" style=\"align-content:start\">\n      ${riq('Scorte in armadio', lista.slice(0, 6).map(b => `\n        <div style=\"margin-bottom:14px\">\n          <div style=\"display:flex;justify-content:space-between;font-size:.86rem;margin-bottom:6px\">\n            <span>${esc(b.nome)}</span><span style=\"color:var(--tenue)\">${b.scorta}</span></div>\n          ${barra(Math.min(100, b.scorta / Math.max(1, b.scorta_minima * 2) * 100),\n                  b.scorta <= b.scorta_minima ? 'var(--rosso)' : COLORE)}\n        </div>`).join('') +\n        (scorte.length ? `<p class=\"nota\">${plurale(scorte.length, 'articolo è', 'articoli sono')} sotto scorta e ${scorte.length === 1 ? 'entra' : 'entrano'} da solo in lista della spesa.</p>` : ''))}\n      <div id=\"storico-bianc\"></div>\n    </div>\n  </div>`;\n}\n\nfunction vistaStoricoBiancheria(b, cambi){\n  return riq('Storico · ' + b.nome, cambi.length\n    ? cambi.map(c => `\n      <div class=\"log-riga\">\n        <span class=\"log-punto\" style=\"--c:var(--pulizie)\"></span>\n        <span class=\"tx\"><strong>${gm(c.data)}</strong><span>${esc(c.persona_nome || 'senza nome')}</span></span>\n        <button data-elimina-cambio=\"${c.id}\" style=\"color:var(--rosso);font-size:.85rem\">Togli</button>\n      </div>`).join('')\n    : vuoto('Nessun cambio registrato ancora'),\n    { raso: true, classe: 'tinta', colore: COLORE });\n}\n\n/* ---------- ore e storico ---------- */\n\nfunction vistaOre(){\n  const ore = S.S.dati.pulizie.ore;\n  const mese = ore.filter(o => o.data.slice(0, 7) === iso(OGGI).slice(0, 7));\n  const totMese = mese.reduce((s, o) => s + o.ore, 0);\n  const lucia = S.S.dati.persone.find(p => p.ruolo === 'collaboratrice');\n  const conto = lucia ? S.contoPersona(lucia.id) : null;\n\n  return `<div class=\"griglia g-lato\">\n    ${riq('Registro giornate', tabella(['Giorno', 'Orario', 'Ore', 'Chi', ''],\n      ore.map(o => `<tr>\n        <td>${esc(new Date(o.data).toLocaleDateString('it-IT', { weekday:'long', day:'numeric', month:'long' }))}</td>\n        <td class=\"num\">${esc(o.ora_inizio || '')} – ${esc(o.ora_fine || '')}</td>\n        <td class=\"num\">${String(o.ore).replace('.', ',')}</td>\n        <td>${esc(S.nomePersona(o.persona_id))}</td>\n        <td style=\"text-align:right\"><div class=\"riga-azioni\" style=\"justify-content:flex-end;display:inline-flex\">\n          <button data-mod-ore=\"${o.id}\" title=\"Modifica\">✎</button>\n          <button data-elimina-ore=\"${o.id}\" title=\"Elimina\" style=\"color:var(--rosso)\">🗑</button>\n        </div></td></tr>`)),\n      { raso: true, classe: 'tinta', colore: COLORE, meta: 'ultimi due mesi, anche passati si possono correggere' })}\n    <div class=\"griglia\" style=\"align-content:start\">\n      ${riq('Questo mese', `\n        <div style=\"display:flex;align-items:center;gap:18px\">\n          <div><b style=\"font-size:2.2rem;letter-spacing:-.04em;color:var(--pulizie)\">${String(totMese).replace('.', ',')}</b>\n          <span class=\"occhiello\" style=\"display:block\">ore lavorate</span></div>\n          <div><b style=\"font-size:2.2rem;letter-spacing:-.04em;color:var(--pulizie)\">${mese.length}</b>\n          <span class=\"occhiello\" style=\"display:block\">giornate</span></div>\n        </div>\n        <p class=\"nota\">Il totale si aggiorna a ogni giornata registrata dalla checklist.</p>`)}\n      ${conto ? riq('Conto con ' + lucia.nome, `\n        <p style=\"margin:0 0 12px;font-size:.92rem\">${fraseConto(lucia.nome, conto.differenza).testo}</p>\n        <p class=\"nota\" style=\"margin:0 0 14px\">${fraseConto(lucia.nome, conto.differenza).sotto}</p>\n        <button class=\"btn chiaro pieno\" data-vai-pagamenti>Vai ai pagamenti</button>\n      `) : ''}\n    </div>\n  </div>`;\n}\n\n/* ---------- impostazioni ---------- */\n\nfunction vistaImpostazioni(){\n  const cats = S.categorie('pulizie');\n  const voci = S.S.dati.pulizie.voci;\n  const lucia = S.S.dati.persone.find(p => p.ruolo === 'collaboratrice');\n\n  return `<div class=\"griglia g-lato\">\n    <div class=\"griglia\" style=\"align-content:start\">\n      ${riq('Voci della checklist', cats.map(c => `\n        <div class=\"gruppo ${aperti.has('cfg_' + c.id) ? 'aperto' : ''}\">\n          <button class=\"capo\" data-gruppo=\"cfg_${c.id}\">\n            <span class=\"emj\">${c.icona}</span><b>${esc(c.nome)}</b>\n            <span class=\"avanz\">${voci.filter(v => v.categoria_id === c.id).length} voci</span>\n            <span class=\"freccia\"></span></button>\n          <div class=\"elenco\"><div>${voci.filter(v => v.categoria_id === c.id).map(v => `\n            <div class=\"compito\" style=\"min-height:64px\">\n              <span class=\"emj\">${v.icona}</span>\n              <span class=\"tx\"><strong>${esc(v.nome)}</strong><span>${FREQ[v.frequenza]}</span></span>\n              <div class=\"riga-azioni\">\n                <button data-mod-voce=\"${v.id}\" title=\"Modifica\">✎</button>\n                <button data-elimina-voce=\"${v.id}\" title=\"Togli dalla checklist\" style=\"color:var(--rosso)\">🗑</button>\n              </div>\n            </div>`).join('')}</div></div>\n        </div>`).join('') +\n        `<div style=\"padding:16px 18px;border-top:1px solid var(--linea-tenue)\">\n           <button class=\"btn chiaro pieno\" data-nuova-voce>Aggiungi una voce</button>\n           <p class=\"nota\">Ogni voce ha la sua frequenza e la sua categoria. Cambiandole si aggiorna anche la prossima scadenza in home.</p>\n         </div>`,\n        { raso: true, classe: 'tinta', colore: COLORE, meta: voci.length + ' voci attive' })}\n\n      ${riq('Come funziona la checklist', `<ul class=\"cfg\" style=\"margin:-16px -18px\">\n        ${rigaCfg('La settimana inizia', '', `<select><option selected>Lunedì</option><option>Domenica</option></select>`)}\n        ${rigaCfg('Registra la data quando spunto', 'Alla prima spunta salva la data di oggi, modificabile con un tocco.', interruttore(true, COLORE))}\n        ${rigaCfg('Chiedi chi ha fatto la lavorazione', 'Mostra la scelta tra le persone di casa e chi viene a pulire.', interruttore(true, COLORE))}\n        ${rigaCfg('Riporta le voci non fatte', 'Restano nella settimana nuova segnalate in rosso.', interruttore(true, COLORE))}\n        ${rigaCfg('Blocca le settimane passate', 'Dopo la domenica lo storico non è più modificabile.', interruttore(false, COLORE))}\n      </ul>`)}\n    </div>\n\n    <div class=\"griglia\" style=\"align-content:start\">\n      ${riq('Chi pulisce', `<ul class=\"cfg\" style=\"margin:-16px -18px\">\n        ${lucia ? `\n        ${rigaCfg('Nome', 'Compare accanto a ogni spunta e nel modulo pagamenti.', `<input type=\"text\" data-persona-nome=\"${lucia.id}\" value=\"${esc(lucia.nome)}\" style=\"min-width:170px\">`)}\n        ${rigaCfg('Tariffa oraria', 'Usata per calcolare quanto è dovuto in base alle ore lavorate.', `<div style=\"display:flex;align-items:center;gap:8px\"><input type=\"number\" min=\"0\" step=\"0.5\" data-persona-tariffa=\"${lucia.id}\" value=\"${lucia.tariffa_oraria || 0}\" style=\"min-width:90px\"><span style=\"color:var(--tenue)\">€/ora</span></div>`)}\n        ` : `<li><span class=\"tx\"><span>Nessuna persona con ruolo \"chi pulisce\". Aggiungila da Casa e famiglia.</span></span></li>`}\n        ${rigaCfg('Giorni di servizio', '', `<select><option selected>Lunedì e giovedì</option><option>Solo lunedì</option><option>Tre volte a settimana</option></select>`)}\n        ${rigaCfg('Orario abituale', '', `<input type=\"time\" value=\"09:00\" style=\"min-width:120px\">`)}\n        ${rigaCfg('Registra le ore lavorate', 'Tabella giorno, orario e ore con totale mensile.', interruttore(true, COLORE))}\n        ${rigaCfg('Vista semplificata', 'Solo checklist e ore, senza calendario, spesa e attività.', interruttore(true, COLORE))}\n      </ul>\n      ${lucia ? `<div style=\"padding:14px 18px;border-top:1px solid var(--linea-tenue)\">\n        <button class=\"btn chiaro pieno\" data-salva-tariffa=\"${lucia.id}\">Salva nome e tariffa</button>\n      </div>` : ''}`)}\n      ${riq('Promemoria', `<ul class=\"cfg\" style=\"margin:-16px -18px\">\n        ${rigaCfg('Avviso il mattino del servizio', 'Alle 08:00.', interruttore(true, COLORE))}\n        ${rigaCfg('Segnala le voci scadute', 'Compaiono in rosso nel riquadro della home.', interruttore(true, COLORE))}\n        ${rigaCfg('Riepilogo della domenica sera', '', interruttore(true, COLORE))}\n      </ul>`)}\n    </div>\n  </div>`;\n}\n\n/* ---------- modulo ---------- */\n\n/* ---------- pagamenti ---------- */\n\nfunction fraseConto(nome, differenza){\n  if (Math.abs(differenza) < 0.005) {\n    return { testo: nome + ': conto in pari', sotto: 'Quanto pagato corrisponde esattamente al dovuto.', classe: 'neutra' };\n  }\n  if (differenza > 0) {\n    return {\n      testo: nome + ' è a debito di ' + differenza.toFixed(2).replace('.', ',') + ' €',\n      sotto: 'Ha ricevuto ' + differenza.toFixed(2).replace('.', ',') + ' € in più del dovuto: si scala dal prossimo pagamento.',\n      classe: 'ambra'\n    };\n  }\n  return {\n    testo: nome + ' è a credito di ' + Math.abs(differenza).toFixed(2).replace('.', ',') + ' €',\n    sotto: 'Le devi ancora ' + Math.abs(differenza).toFixed(2).replace('.', ',') + ' €.',\n    classe: 'rossa'\n  };\n}\n\nfunction bloccoPersona(p){\n  const conto = S.contoPersona(p.id);\n  const frase = fraseConto(p.nome, conto.differenza);\n  const pagamenti = S.pagamentiDi(p.id);\n\n  return riq(p.nome, `\n    <div style=\"display:flex;align-items:center;gap:22px;flex-wrap:wrap;margin-bottom:18px\">\n      <div><b style=\"font-size:1.7rem;letter-spacing:-.03em;color:${COLORE}\">${conto.oreTotali.toFixed(1).replace('.', ',')}</b>\n        <span class=\"occhiello\" style=\"display:block\">ore lavorate in tutto</span></div>\n      <div><b style=\"font-size:1.7rem;letter-spacing:-.03em;color:${COLORE}\">${conto.dovuto.toFixed(2).replace('.', ',')} €</b>\n        <span class=\"occhiello\" style=\"display:block\">dovuto a ${p.tariffa_oraria} €/ora</span></div>\n      <div><b style=\"font-size:1.7rem;letter-spacing:-.03em;color:${COLORE}\">${conto.pagato.toFixed(2).replace('.', ',')} €</b>\n        <span class=\"occhiello\" style=\"display:block\">pagato finora</span></div>\n    </div>\n    <div class=\"urg ${frase.classe === 'neutra' ? 'calma' : ''}\" style=\"cursor:default;${frase.classe === 'rossa' ? 'border-color:#EBCEC8' : ''}\">\n      <span class=\"emj\">${frase.classe === 'neutra' ? '✅' : frase.classe === 'ambra' ? '💶' : '🔔'}</span>\n      <span><b style=\"${frase.classe === 'ambra' ? 'color:#8A5F0B' : frase.classe === 'rossa' ? 'color:var(--rosso)' : ''}\">${esc(frase.testo)}</b>\n      <span>${esc(frase.sotto)}</span></span>\n    </div>\n    <p class=\"section-t\" style=\"margin:20px 0 0\">Storico pagamenti</p>\n    <div style=\"margin:0 -18px\">\n      ${pagamenti.length ? pagamenti.map(pg => `\n        <div class=\"log-riga\">\n          <span class=\"log-punto\" style=\"--c:${COLORE}\"></span>\n          <span class=\"tx\"><strong>${Number(pg.importo).toFixed(2).replace('.', ',')} €</strong>\n            <span>${gm(pg.data)}${pg.nota ? ' · ' + esc(pg.nota) : ''}</span></span>\n          <div class=\"riga-azioni\">\n            <button data-mod-pag=\"${pg.id}\" title=\"Modifica\">✎</button>\n          </div>\n        </div>`).join('') : `<p class=\"vuoto\">Nessun pagamento ancora registrato</p>`}\n    </div>\n    <div style=\"padding:16px 0 0\">\n      <button class=\"btn pieno\" style=\"background:${COLORE}\" data-nuovo-pag=\"${p.id}\">Registra un pagamento</button>\n    </div>\n  `, { classe: 'tinta', colore: COLORE });\n}\n\nfunction vistaPagamenti(){\n  const collaboratrici = S.S.dati.persone.filter(p => p.ruolo === 'collaboratrice');\n  if (!collaboratrici.length) {\n    return riq('Pagamenti', vuoto('Nessuna persona con ruolo \"chi pulisce\" al momento. Aggiungila da Casa e famiglia per attivare il conto.'));\n  }\n  return `<div class=\"griglia\" style=\"gap:18px\">${collaboratrici.map(bloccoPersona).join('')}</div>`;\n}\n\nexport default {\n  id: 'pulizie',\n  nome: 'Pulizie',\n  emoji: '🧽',\n  colore: COLORE,\n  sezioni: [\n    { id: 'checklist', nome: 'Checklist' },\n    { id: 'biancheria', nome: 'Biancheria' },\n    { id: 'ore', nome: 'Ore e storico' },\n    { id: 'pagamenti', nome: 'Pagamenti' },\n    { id: 'impostazioni', nome: 'Impostazioni' }\n  ],\n\n  distintivo(){\n    const av = S.avanzamentoPulizie();\n    return { n: av.restanti, caldo: false };\n  },\n\n  render(sezione){\n    if (sezione === 'biancheria') return vistaBiancheria();\n    if (sezione === 'ore') return vistaOre();\n    if (sezione === 'pagamenti') return vistaPagamenti();\n    if (sezione === 'impostazioni') return vistaImpostazioni();\n    return vistaChecklist();\n  },\n\n  aggancia(root, contesto){\n    root.addEventListener('click', async e => {\n      const g = e.target.closest('[data-gruppo]');\n      if (g) {\n        const id = g.dataset.gruppo;\n        aperti.has(id) ? aperti.delete(id) : aperti.add(id);\n        g.closest('.gruppo').classList.toggle('aperto');\n        return;\n      }\n\n      const sett = e.target.closest('[data-sett]');\n      if (sett) {\n        const n = parseInt(sett.dataset.sett, 10);\n        const nuova = n === 0 ? lunedi() : piu(new Date(S.S.settimana + 'T00:00:00'), n * 7);\n        S.carica(iso(nuova));\n        return;\n      }\n\n      const seg = e.target.closest('[data-segna]');\n      if (seg) {\n        const voce = seg.dataset.voce, tipo = seg.dataset.segna;\n        const attuale = S.spunta(voce);\n        if (attuale?.stato === tipo) {\n          S.applicaSpunta(voce, null);\n          prova(api.togliSpunta(voce, S.S.settimana));\n        } else {\n          const chi = S.S.dati.persone.find(p => p.ruolo === 'collaboratrice')?.id || 'vivien';\n          const nomeVoce = S.S.dati.pulizie.voci.find(v => v.id === voce)?.nome || voce;\n          S.applicaSpunta(voce, tipo, OGGI, chi);\n          S.aggiungiRegistroLocale('pulizie', tipo, nomeVoce, chi);\n          prova(api.spuntaPulizia({ voce_id: voce, settimana: S.S.settimana, stato: tipo,\n                                    data: iso(OGGI), persona_id: chi }));\n          avviso(tipo === 'fatto' ? 'Segnato come fatto oggi' : 'Segnato come parziale');\n        }\n        return;\n      }\n\n      const dt = e.target.closest('[data-data]');\n      if (dt) {\n        const voce = S.S.dati.pulizie.voci.find(v => v.id === dt.dataset.data);\n        const attuale = S.spunta(voce.id);\n        const r = await modaleData({\n          titolo: voce.nome,\n          sottotitolo: attuale\n            ? 'Registrata il ' + gm(attuale.data) + '. Cambia la data se serve.'\n            : 'Scegli quando è stata fatta.',\n          persone: S.S.dati.persone.filter(p => p.ruolo !== 'bambina'),\n          personaScelta: attuale?.persona_id || S.S.dati.persone.find(p => p.ruolo === 'collaboratrice')?.id\n        });\n        if (!r) return;\n        if (r.azione === 'togli') {\n          S.applicaSpunta(voce.id, null);\n          prova(api.togliSpunta(voce.id, S.S.settimana));\n        } else {\n          S.applicaSpunta(voce.id, 'fatto', r.data, r.persona);\n          S.aggiungiRegistroLocale('pulizie', 'fatto', voce.nome, r.persona);\n          prova(api.spuntaPulizia({ voce_id: voce.id, settimana: S.S.settimana, stato: 'fatto',\n                                    data: iso(r.data), persona_id: r.persona }));\n          avviso('Registrata il ' + gm(r.data));\n        }\n        return;\n      }\n\n      const cb = e.target.closest('[data-cambio]');\n      if (cb) {\n        const b = S.S.dati.biancheria.find(x => x.id === cb.dataset.cambio);\n        const r = await modaleData({\n          titolo: b.nome, sottotitolo: 'Quando è stato fatto il cambio?',\n          persone: S.S.dati.persone.filter(p => p.ruolo !== 'bambina'),\n          personaScelta: b.persona_id, mostraTogli: false\n        });\n        if (!r || r.azione !== 'segna') return;\n        S.applicaCambioBiancheria(b.id, r.data);\n        S.aggiungiRegistroLocale('pulizie', 'cambio biancheria', b.nome, r.persona);\n        prova(api.cambioBiancheria({ id: b.id, data: iso(r.data), persona_id: r.persona }));\n        avviso(b.nome + ' aggiornato al ' + gm(r.data));\n        return;\n      }\n\n      if (e.target.closest('[data-nuova-giornata]')) {\n        const chi = S.S.dati.persone.find(p => p.ruolo === 'collaboratrice')?.id;\n        S.S.dati.pulizie.ore.unshift({ id: 'loc' + Date.now(), persona_id: chi,\n          data: iso(OGGI), ora_inizio: '09:00', ora_fine: '12:00', ore: 3 });\n        prova(api.aggiungiOre({ data: iso(OGGI), ora_inizio: '09:00', ora_fine: '12:00', persona_id: chi }));\n        S.avvisa();\n        avviso('Giornata di oggi aggiunta, 3 ore');\n        return;\n      }\n\n      /* ---- nuova voce / modifica / eliminazione ---- */\n      const opzCat = S.categorie('pulizie').map(c => ({ id: c.id, nome: c.nome }));\n      const opzFreq = Object.entries(FREQ).map(([id, nome]) => ({ id, nome }));\n      const opzPersone = [{ id:'', nome:'Nessuno in particolare' }, ...S.S.dati.persone.map(p => ({ id:p.id, nome:p.nome }))];\n\n      if (e.target.closest('[data-nuova-voce]')) {\n        const r = await modaleForm({\n          titolo: 'Nuova voce di checklist', colore: COLORE,\n          campi: [\n            { nome:'nome', etichetta:'Nome della voce', richiesto:true, placeholder:'Es. Vetri del salotto' },\n            { nome:'categoria_id', etichetta:'Zona', tipo:'select', opzioni: opzCat, richiesto:true },\n            { nome:'frequenza', etichetta:'Ogni quanto', tipo:'select', opzioni: opzFreq, difetto:'settimanale' },\n            { nome:'icona', etichetta:'Icona (una emoji)', placeholder:'🧽', difetto:'🧽' }\n          ]\n        });\n        if (r?.azione === 'salva' && r.valori.nome) {\n          const nuova = { id:'loc'+Date.now(), ...r.valori, ogni_giorni: FREQ[r.valori.frequenza] ? undefined : 7 };\n          S.aggiungiVoceLocale(nuova);\n          prova(api.creaVoce(r.valori));\n          avviso('Voce aggiunta alla checklist');\n        }\n        return;\n      }\n\n      const modVoce = e.target.closest('[data-mod-voce]');\n      if (modVoce) {\n        const v = S.S.dati.pulizie.voci.find(x => x.id === modVoce.dataset.modVoce);\n        const r = await modaleForm({\n          titolo: v.nome, colore: COLORE, permettiElimina: true,\n          valori: { nome:v.nome, categoria_id:v.categoria_id, frequenza:v.frequenza, icona:v.icona },\n          campi: [\n            { nome:'nome', etichetta:'Nome della voce', richiesto:true },\n            { nome:'categoria_id', etichetta:'Zona', tipo:'select', opzioni: opzCat },\n            { nome:'frequenza', etichetta:'Ogni quanto', tipo:'select', opzioni: opzFreq },\n            { nome:'icona', etichetta:'Icona' }\n          ]\n        });\n        if (r?.azione === 'salva') {\n          S.modificaVoceLocale(v.id, r.valori);\n          prova(api.modificaVoce({ id: v.id, ...r.valori }));\n          avviso('Voce aggiornata');\n        } else if (r?.azione === 'elimina') {\n          S.rimuoviVoceLocale(v.id);\n          prova(api.eliminaVoce(v.id));\n          avviso('Voce tolta dalla checklist');\n        }\n        return;\n      }\n\n      const elVoce = e.target.closest('[data-elimina-voce]');\n      if (elVoce) {\n        S.rimuoviVoceLocale(elVoce.dataset.eliminaVoce);\n        prova(api.eliminaVoce(elVoce.dataset.eliminaVoce));\n        avviso('Voce tolta dalla checklist');\n        return;\n      }\n\n      /* ---- biancheria: nuovo articolo, modifica, storico ---- */\n      if (e.target.closest('[data-nuovo-bianc]')) {\n        const r = await modaleForm({\n          titolo: 'Nuovo articolo di biancheria', colore: COLORE,\n          campi: [\n            { nome:'nome', etichetta:'Nome', richiesto:true, placeholder:'Es. Federe cuscini' },\n            { nome:'ogni_giorni', etichetta:'Ogni quanti giorni si cambia', tipo:'numero', difetto:7, min:1 },\n            { nome:'persona_id', etichetta:'Chi se ne occupa di solito', tipo:'select', opzioni: opzPersone },\n            { nome:'scorta', etichetta:'Quanti pezzi in scorta', tipo:'numero', difetto:2, min:0 },\n            { nome:'scorta_minima', etichetta:'Scorta minima prima di riordinare', tipo:'numero', difetto:2, min:0 }\n          ]\n        });\n        if (r?.azione === 'salva' && r.valori.nome) {\n          const nuovo = { id:'loc'+Date.now(), ...r.valori, ultimo_cambio: iso(OGGI) };\n          S.aggiungiBiancheriaLocale(nuovo);\n          prova(api.salvaBiancheria({ ...r.valori, ultimo_cambio: iso(OGGI) }));\n          avviso('Articolo aggiunto');\n        }\n        return;\n      }\n\n      const modBianc = e.target.closest('[data-mod-bianc]');\n      if (modBianc) {\n        const b = S.S.dati.biancheria.find(x => x.id === modBianc.dataset.modBianc);\n        const r = await modaleForm({\n          titolo: b.nome, colore: COLORE, permettiElimina: true,\n          valori: { nome:b.nome, ogni_giorni:b.ogni_giorni, persona_id:b.persona_id || '', scorta:b.scorta, scorta_minima:b.scorta_minima },\n          campi: [\n            { nome:'nome', etichetta:'Nome', richiesto:true },\n            { nome:'ogni_giorni', etichetta:'Ogni quanti giorni', tipo:'numero', min:1 },\n            { nome:'persona_id', etichetta:'Chi se ne occupa', tipo:'select', opzioni: opzPersone },\n            { nome:'scorta', etichetta:'Pezzi in scorta', tipo:'numero', min:0 },\n            { nome:'scorta_minima', etichetta:'Scorta minima', tipo:'numero', min:0 }\n          ]\n        });\n        if (r?.azione === 'salva') {\n          S.modificaBiancheriaLocale(b.id, r.valori);\n          prova(api.salvaBiancheria({ id: b.id, ...r.valori }));\n          avviso('Articolo aggiornato');\n        } else if (r?.azione === 'elimina') {\n          S.rimuoviBiancheriaLocale(b.id);\n          prova(api.eliminaBiancheria(b.id));\n          avviso('Articolo tolto');\n        }\n        return;\n      }\n\n      const storico = e.target.closest('[data-storico]');\n      if (storico) {\n        const b = S.S.dati.biancheria.find(x => x.id === storico.dataset.storico);\n        const box = root.querySelector('#storico-bianc');\n        box.innerHTML = '<p class=\"vuoto\">Carico lo storico…</p>';\n        try {\n          const r = await api.storicoBiancheria(b.id);\n          box.innerHTML = vistaStoricoBiancheria(b, r.cambi);\n        } catch { box.innerHTML = vistaStoricoBiancheria(b, []); }\n        box.scrollIntoView({ behavior:'smooth', block:'nearest' });\n        return;\n      }\n\n      const elCambio = e.target.closest('[data-elimina-cambio]');\n      if (elCambio) {\n        prova(api.eliminaCambioBiancheria(elCambio.dataset.eliminaCambio));\n        elCambio.closest('.log-riga').remove();\n        avviso('Cambio tolto dallo storico');\n        return;\n      }\n\n      /* ---- ore lavorate: modifica e cancellazione righe storiche ---- */\n      const modOre = e.target.closest('[data-mod-ore]');\n      if (modOre) {\n        const o = S.S.dati.pulizie.ore.find(x => String(x.id) === modOre.dataset.modOre);\n        const r = await modaleForm({\n          titolo: 'Correggi la giornata', colore: COLORE, permettiElimina: true,\n          valori: { data:o.data, ora_inizio:o.ora_inizio, ora_fine:o.ora_fine, persona_id:o.persona_id || '' },\n          campi: [\n            { nome:'data', etichetta:'Giorno', tipo:'data', richiesto:true },\n            { nome:'ora_inizio', etichetta:'Ora inizio (es. 09:00)' },\n            { nome:'ora_fine', etichetta:'Ora fine (es. 12:00)' },\n            { nome:'persona_id', etichetta:'Chi', tipo:'select', opzioni: opzPersone }\n          ]\n        });\n        if (r?.azione === 'salva') {\n          S.modificaOreLocale(o.id, r.valori);\n          prova(api.modificaOre({ id: o.id, ...r.valori }));\n          avviso('Giornata corretta');\n        } else if (r?.azione === 'elimina') {\n          S.rimuoviOreLocale(o.id);\n          prova(api.eliminaOre(o.id));\n          avviso('Giornata eliminata');\n        }\n        return;\n      }\n\n      const elOre = e.target.closest('[data-elimina-ore]');\n      if (elOre) {\n        S.rimuoviOreLocale(elOre.dataset.eliminaOre);\n        prova(api.eliminaOre(elOre.dataset.eliminaOre));\n        avviso('Giornata eliminata');\n        return;\n      }\n\n      if (e.target.closest('[data-salva-tariffa]')) {\n        const id = e.target.closest('[data-salva-tariffa]').dataset.salvaTariffa;\n        const nome = root.querySelector(`[data-persona-nome=\"${id}\"]`).value.trim();\n        const tariffa = Number(root.querySelector(`[data-persona-tariffa=\"${id}\"]`).value) || 0;\n        S.modificaPersonaLocale(id, { nome, tariffa_oraria: tariffa });\n        prova(api.modificaPersona({ id, nome, tariffa_oraria: tariffa }));\n        avviso('Nome e tariffa aggiornati');\n        return;\n      }\n\n      /* ---- pagamenti ---- */\n      const nuovoPag = e.target.closest('[data-nuovo-pag]');\n      if (nuovoPag) {\n        const personaId = nuovoPag.dataset.nuovoPag;\n        const r = await modaleForm({\n          titolo: 'Registra un pagamento', colore: COLORE,\n          valori: { data: iso(OGGI) },\n          campi: [\n            { nome:'importo', etichetta:'Quanto hai pagato (€)', tipo:'numero', min:0, step:0.5, richiesto:true },\n            { nome:'data', etichetta:'Quando', tipo:'data', richiesto:true },\n            { nome:'nota', etichetta:'Nota', placeholder:'Es. Contanti, bonifico...' }\n          ]\n        });\n        if (r?.azione === 'salva' && r.valori.importo) {\n          const pag = { id:'loc'+Date.now(), persona_id: personaId, ...r.valori, importo: Number(r.valori.importo) };\n          S.aggiungiPagamentoLocale(pag);\n          prova(api.creaPagamento({ persona_id: personaId, ...r.valori }));\n          avviso('Pagamento registrato');\n        }\n        return;\n      }\n\n      const modPag = e.target.closest('[data-mod-pag]');\n      if (modPag) {\n        const pag = (S.S.dati.pagamenti || []).find(x => String(x.id) === modPag.dataset.modPag);\n        const r = await modaleForm({\n          titolo: 'Modifica il pagamento', colore: COLORE, permettiElimina: true,\n          valori: { importo: pag.importo, data: pag.data, nota: pag.nota || '' },\n          campi: [\n            { nome:'importo', etichetta:'Importo (€)', tipo:'numero', min:0, step:0.5, richiesto:true },\n            { nome:'data', etichetta:'Quando', tipo:'data' },\n            { nome:'nota', etichetta:'Nota' }\n          ]\n        });\n        if (r?.azione === 'salva') {\n          const v = { ...r.valori, importo: Number(r.valori.importo) };\n          S.modificaPagamentoLocale(pag.id, v);\n          prova(api.modificaPagamento({ id: pag.id, ...v }));\n          avviso('Pagamento aggiornato');\n        } else if (r?.azione === 'elimina') {\n          S.rimuoviPagamentoLocale(pag.id);\n          prova(api.eliminaPagamento(pag.id));\n          avviso('Pagamento tolto');\n        }\n      }\n      if (e.target.closest('[data-vai-pagamenti]')) {\n        contesto.vai('pulizie', 'pagamenti');\n      }\n    });\n  }\n};\n", "/js/moduli/registro.js": "// Registro di casa: ogni spunta, cambio biancheria, aggiunta spesa e attività\n// segnata come fatta lascia una riga qui, con chi e quando.\n\nimport { esc, plurale } from '../util.js';\nimport { riq, vuoto } from '../ui.js';\nimport { api } from '../api.js';\nimport * as S from '../stato.js';\n\nconst COLORE = 'var(--home)';\nconst TINTE = { pulizie:'var(--pulizie)', calendario:'var(--calendario)', spesa:'var(--spesa)', attivita:'var(--attivita)' };\nconst ETICHETTE = {\n  fatto:'segnato come fatto', parziale:'segnato come parziale', aggiunto:'aggiunto',\n  rimosso:'rimosso', 'cambio biancheria':'cambio registrato'\n};\n\nlet filtro = null;\n\nfunction quando(iso){\n  const d = new Date(iso.replace(' ', 'T') + (iso.includes('Z') ? '' : 'Z'));\n  const ora = d.toLocaleTimeString('it-IT', { hour:'2-digit', minute:'2-digit' });\n  const oggi = new Date().toDateString() === d.toDateString();\n  return (oggi ? 'oggi' : d.toLocaleDateString('it-IT', { day:'numeric', month:'short' })) + ' alle ' + ora;\n}\n\nfunction righeLog(){\n  const lista = S.registro(filtro);\n  if (!lista.length) return vuoto('Ancora nessuna registrazione');\n  return lista.map(r => `\n    <div class=\"log-riga\">\n      <span class=\"log-punto\" style=\"--c:${TINTE[r.modulo] || COLORE}\"></span>\n      <span class=\"tx\"><strong>${esc(r.dettaglio || r.azione)}</strong>\n        <span>${esc(ETICHETTE[r.azione] || r.azione)}${r.persona_nome ? ' · ' + esc(r.persona_nome) : ''}</span></span>\n      <span class=\"qd\">${quando(r.creato_il)}</span>\n    </div>`).join('');\n}\n\nexport default {\n  id: 'registro',\n  nome: 'Registro',\n  emoji: '📋',\n  colore: COLORE,\n  sezioni: [{ id:'tutto', nome:'Tutte le registrazioni' }],\n  distintivo(){ return { n: 0, caldo: false }; },\n\n  render(){\n    return `<div class=\"griglia g-lato\">\n      ${riq('Ultime registrazioni', righeLog(),\n        { raso:true, classe:'tinta', colore: filtro ? TINTE[filtro] : COLORE,\n          meta: plurale(S.registro(filtro).length, 'voce', 'voci') })}\n      <div class=\"griglia\" style=\"align-content:start\">\n        ${riq('Filtra per modulo', `\n          <div class=\"etichette\">\n            <button class=\"et-i ${!filtro ? 'aggiungi' : ''}\" data-filtro=\"\">Tutti</button>\n            <button class=\"et-i\" data-filtro=\"pulizie\">🧽 Pulizie</button>\n            <button class=\"et-i\" data-filtro=\"spesa\">🛒 Spesa</button>\n            <button class=\"et-i\" data-filtro=\"attivita\">🔔 Attività</button>\n            <button class=\"et-i\" data-filtro=\"calendario\">📅 Calendario</button>\n          </div>\n          <p class=\"nota\">Ogni volta che qualcuno spunta una voce, cambia la biancheria o aggiunge un articolo, resta scritto qui: cosa, chi e a che ora.</p>`)}\n      </div>\n    </div>`;\n  },\n\n  aggancia(root){\n    root.addEventListener('click', async e => {\n      const f = e.target.closest('[data-filtro]');\n      if (!f) return;\n      filtro = f.dataset.filtro || null;\n      try {\n        const r = await api.registro(filtro, 150);\n        S.S.dati.registro = r.righe;\n      } catch { /* resta con quello che ha già in memoria */ }\n      this.ridisegna();\n    });\n  }\n};\n", "/js/moduli/spesa.js": "// Modulo lista della spesa: righe raggruppate per reparto, comando rapido iPhone\n// e impostazioni. La spunta è grande, si usa camminando tra gli scaffali.\n\nimport { esc, plurale, avviso } from '../util.js';\nimport { riq, rigaCfg, interruttore, vuoto } from '../ui.js';\nimport { api, prova, chiave, salvaChiave, rete } from '../api.js';\nimport * as S from '../stato.js';\n\nconst COLORE = 'var(--spesa)';\n\nfunction vistaLista(){\n  const cats = S.categorie('spesa');\n  const tutti = S.S.dati.spesa.articoli;\n  const daPrendere = tutti.filter(a => a.stato === 'da_prendere');\n\n  const gruppi = cats.map(c => {\n    const art = tutti.filter(a => a.categoria_id === c.id);\n    if (!art.length) return '';\n    return `\n      <div class=\"gruppo aperto\">\n        <button class=\"capo\" data-gruppo=\"sp_${c.id}\">\n          <span class=\"emj\">${c.icona}</span><b>${esc(c.nome)}</b>\n          <span class=\"avanz\">${art.filter(a => a.stato === 'da_prendere').length} da prendere</span>\n          <span class=\"freccia\"></span></button>\n        <div class=\"elenco\"><div>${art.map(articolo).join('')}</div></div>\n      </div>`;\n  }).join('');\n\n  const senza = tutti.filter(a => !a.categoria_id);\n\n  return `<div class=\"griglia g-lato\">\n    ${riq('Lista corrente', gruppi + (senza.length\n        ? `<div class=\"gruppo aperto\"><button class=\"capo\" data-gruppo=\"sp_altro\">\n             <span class=\"emj\">📦</span><b>Da smistare</b>\n             <span class=\"avanz\">${senza.length}</span><span class=\"freccia\"></span></button>\n           <div class=\"elenco\"><div>${senza.map(articolo).join('')}</div></div></div>`\n        : '') || vuoto('La lista è vuota'),\n      { raso: true, classe: 'tinta', colore: COLORE,\n        meta: plurale(daPrendere.length, 'articolo da prendere', 'articoli da prendere') })}\n\n    <div class=\"griglia\" style=\"align-content:start\">\n      ${riq('Aggiungi alla lista', `\n        <div style=\"display:flex;gap:9px\">\n          <input type=\"text\" id=\"nuovo-articolo\" placeholder=\"Che cosa serve?\" style=\"flex:1;min-width:0\">\n          <button class=\"btn\" style=\"background:var(--spesa)\" data-aggiungi>Aggiungi</button>\n        </div>\n        <p class=\"occhiello\" style=\"margin:18px 0 10px\">Comprati spesso</p>\n        <div class=\"etichette\">\n          ${['Latte','Pane','Uova','Pannolini','Yogurt bambine','Strofinacci'].map(n =>\n            `<button class=\"et-i\" data-veloce=\"${esc(n)}\">${esc(n)}</button>`).join('')}\n        </div>`)}\n      ${riq('Dall\\'iPhone', `<ul class=\"righe\" style=\"margin:-16px -18px\">\n        ${tutti.filter(a => a.origine === 'iphone').map(a =>\n          `<li><span class=\"tx\"><strong>${esc(a.nome)}</strong><span>${esc(S.nomePersona(a.persona_id))}</span></span></li>`).join('')\n          || `<li><span class=\"tx\"><span>Niente di nuovo dal telefono</span></span></li>`}\n      </ul>`)}\n    </div>\n  </div>`;\n}\n\nconst articolo = a => `\n  <div class=\"art ${a.stato === 'preso' ? 'preso' : ''}\">\n    <button class=\"spunta ${a.stato === 'preso' ? 'on' : ''}\" data-preso=\"${a.id}\"></button>\n    <span class=\"tx\"><strong>${esc(a.nome)}</strong>\n      <span>${esc(a.origine === 'iphone' ? 'aggiunto dall\\'iPhone' :\n                   a.origine === 'ricorrente' ? 'articolo ricorrente' :\n                   a.origine === 'scorta' ? 'scorta bassa' : S.nomePersona(a.persona_id))}</span></span>\n    <span class=\"qd\">${esc(a.quantita || '')}</span>\n  </div>`;\n\nfunction vistaIphone(){\n  const url = location.origin + '/api/shortcut';\n  return `<div class=\"griglia g-lato\">\n    ${riq('Il percorso del comando', `\n      <ol style=\"list-style:none;margin:0;padding:0\">\n        ${[['Tocchi l\\'icona sulla schermata home','Nessuna app da aprire, nessun accesso da fare.'],\n           ['Il comando chiede: vedere o aggiungere','Due voci sole, si sceglie con un pollice.'],\n           ['Detti o scrivi che cosa serve','Anche più articoli separati dalla virgola.'],\n           ['La lista di casa si aggiorna','L\\'iPad mostra il nuovo articolo entro pochi secondi.']]\n          .map(([t, s], i) => `\n          <li style=\"display:flex;gap:15px;padding-bottom:20px\">\n            <span style=\"width:30px;height:30px;border-radius:50%;background:var(--spesa);color:#fff;\n              display:flex;align-items:center;justify-content:center;font-weight:700;flex:none\">${i+1}</span>\n            <span><b style=\"display:block\">${esc(t)}</b>\n            <span style=\"color:var(--tenue);font-size:.87rem\">${esc(s)}</span></span></li>`).join('')}\n      </ol>\n      <p class=\"nota\">Indirizzo da usare nel comando: <code>${esc(url)}</code></p>`,\n      { classe: 'tinta', colore: COLORE })}\n\n    <div class=\"griglia\" style=\"align-content:start\">\n      ${riq('Come appare sull\\'iPhone', `\n        <div class=\"telefono\">\n          <div class=\"sbarra\"><span>21:05</span><span>Comandi</span></div>\n          <p class=\"dom\">Spesa di casa<br>Che cosa vuoi fare?</p>\n          <div class=\"sc\">👀 Vedi la lista</div>\n          <div class=\"sc pri\">➕ Aggiungi qualcosa</div>\n        </div>`)}\n      ${riq('Collegamento', `<ul class=\"cfg\" style=\"margin:-16px -18px\">\n        ${rigaCfg('Stato', rete.collegata ? 'L\\'app sta leggendo dal database.' : 'Al momento sta usando i dati locali.',\n          `<span class=\"pill ${rete.collegata ? 'verde' : 'ambra'}\">${rete.collegata ? 'Collegata' : 'Non collegata'}</span>`)}\n        ${rigaCfg('Chiave di casa', 'La stessa che metti nel comando rapido.',\n          `<input type=\"password\" id=\"campo-chiave\" value=\"${esc(chiave())}\" style=\"min-width:180px\">`)}\n        ${rigaCfg('', '', `<button class=\"btn piccolo\" style=\"background:var(--spesa)\" data-salva-chiave>Salva e riprova</button>`)}\n      </ul>`)}\n    </div>\n  </div>`;\n}\n\nfunction vistaImpostazioni(){\n  return `<div class=\"griglia g-lato\">\n    <div class=\"griglia\" style=\"align-content:start\">\n      ${riq('Reparti', `<div class=\"etichette\">\n        ${S.categorie('spesa').map(c => `<span class=\"et-i\">${c.icona} ${esc(c.nome)}</span>`).join('')}\n        <span class=\"et-i aggiungi\">Aggiungi reparto</span></div>\n        <p class=\"nota\">L'ordine dei reparti segue il percorso che fai in negozio: la lista si riordina da sola.</p>`,\n        { classe: 'tinta', colore: COLORE })}\n      ${riq('Articoli ricorrenti', `<ul class=\"cfg\" style=\"margin:-16px -18px\">\n        ${[['Detersivo lavatrice','Torna in lista ogni 4 settimane.'],\n           ['Pannolini taglia 5','Torna in lista ogni 2 settimane.'],\n           ['Sacchi umido','Torna in lista ogni mese.'],\n           ['Caffè macinato','Torna in lista ogni 2 settimane.']]\n          .map(([t, s]) => rigaCfg(t, s, interruttore(true, COLORE))).join('')}\n      </ul>`)}\n    </div>\n    <div class=\"griglia\" style=\"align-content:start\">\n      ${riq('Come si comporta la lista', `<ul class=\"cfg\" style=\"margin:-16px -18px\">\n        ${rigaCfg('Articoli presi', '', `<select><option selected>Restano in fondo</option><option>Spariscono subito</option></select>`)}\n        ${rigaCfg('Svuota dopo la spesa', 'La lista si azzera quando segni la spesa come conclusa.', interruttore(true, COLORE))}\n        ${rigaCfg('Unisci i doppioni', 'Se in due aggiungete la stessa cosa resta una riga sola.', interruttore(true, COLORE))}\n        ${rigaCfg('Scorte basse in lista', 'Gli articoli sotto soglia entrano da soli.', interruttore(true, COLORE))}\n        ${rigaCfg('Ricontrolla la lista ogni', '', `<select><option>15 secondi</option><option selected>30 secondi</option><option>1 minuto</option></select>`)}\n      </ul>`)}\n      ${riq('Chi può modificare', `<ul class=\"cfg\" style=\"margin:-16px -18px\">\n        ${S.S.dati.persone.filter(p => p.ruolo !== 'bambina').map(p =>\n          rigaCfg(p.nome, p.ruolo === 'collaboratrice' ? 'Solo aggiunta' : 'Aggiunge e conclude la spesa',\n                  interruttore(true, COLORE))).join('')}\n      </ul>`)}\n    </div>\n  </div>`;\n}\n\nexport default {\n  id: 'spesa',\n  nome: 'Lista della spesa',\n  emoji: '🛒',\n  colore: COLORE,\n  sezioni: [\n    { id: 'lista', nome: 'Lista' },\n    { id: 'iphone', nome: 'Comando iPhone' },\n    { id: 'impostazioni', nome: 'Impostazioni' }\n  ],\n\n  distintivo(){ return { n: S.spesaDaPrendere().length, caldo: false }; },\n\n  render(sezione){\n    if (sezione === 'iphone') return vistaIphone();\n    if (sezione === 'impostazioni') return vistaImpostazioni();\n    return vistaLista();\n  },\n\n  aggancia(root){\n    const aggiungi = nome => {\n      if (!nome || !nome.trim()) return;\n      S.aggiungiArticoloLocale(nome.trim(), '', null);\n      prova(api.aggiungiSpesa({ nome: nome.trim(), origine: 'tablet' }));\n      avviso(nome.trim() + ' aggiunto alla lista');\n    };\n\n    root.addEventListener('click', e => {\n      const g = e.target.closest('[data-gruppo]');\n      if (g) { g.closest('.gruppo').classList.toggle('aperto'); return; }\n\n      const p = e.target.closest('[data-preso]');\n      if (p) {\n        const id = p.dataset.preso;\n        const a = S.S.dati.spesa.articoli.find(x => String(x.id) === id);\n        const nuovo = a.stato === 'preso' ? 'da_prendere' : 'preso';\n        S.applicaSpesa(a.id, { stato: nuovo });\n        prova(api.modificaSpesa(id, { stato: nuovo }));\n        return;\n      }\n\n      if (e.target.closest('[data-aggiungi]')) {\n        const campo = root.querySelector('#nuovo-articolo');\n        aggiungi(campo.value); campo.value = '';\n        return;\n      }\n\n      const v = e.target.closest('[data-veloce]');\n      if (v) { aggiungi(v.dataset.veloce); return; }\n\n      if (e.target.closest('[data-salva-chiave]')) {\n        salvaChiave(root.querySelector('#campo-chiave').value.trim());\n        avviso('Chiave salvata, ricarico i dati');\n        S.carica();\n      }\n    });\n\n    root.addEventListener('keydown', e => {\n      if (e.key === 'Enter' && e.target.id === 'nuovo-articolo') {\n        aggiungi(e.target.value); e.target.value = '';\n      }\n    });\n  }\n};\n", "/js/stato.js": "// Stato dell'applicazione: unica fonte di verità per tutti i moduli.\n// I moduli non parlano tra loro, leggono da qui e si iscrivono ai cambiamenti.\n\nimport { caricaStato, rete } from './api.js';\nimport { OGGI, piu, iso, lunedi, data, scarto, scadenzaEtichetta } from './util.js';\n\nconst iscritti = new Set();\n\nexport const S = {\n  dati: null,\n  settimana: iso(lunedi()),\n  caricamento: true,\n  rete\n};\n\nexport const iscriviti = fn => { iscritti.add(fn); return () => iscritti.delete(fn); };\nexport const avvisa = () => iscritti.forEach(fn => fn(S));\n\nexport async function carica(settimana = S.settimana){\n  S.caricamento = true; avvisa();\n  S.settimana = settimana;\n  S.dati = await caricaStato(settimana);\n  S.caricamento = false;\n  avvisa();\n}\n\n/* ---------- letture comode ---------- */\n\nexport const persona = id => S.dati?.persone.find(p => p.id === id) || null;\nexport const nomePersona = id => persona(id)?.nome || '';\nexport const categorie = modulo => (S.dati?.categorie || []).filter(c => c.modulo === modulo);\nexport const categoria = id => S.dati?.categorie.find(c => c.id === id) || null;\n\nexport const impostazione = (modulo, chiave, difetto = '') =>\n  S.dati?.impostazioni.find(i => i.modulo === modulo && i.chiave === chiave)?.valore ?? difetto;\n\nexport const spunta = voceId => S.dati?.pulizie.spunte.find(s => s.voce_id === voceId) || null;\n\n/* ---------- calcoli condivisi ---------- */\n\nexport function avanzamentoPulizie(){\n  const voci = S.dati?.pulizie.voci || [];\n  const fatte = voci.filter(v => spunta(v.id)?.stato === 'fatto').length;\n  const parziali = voci.filter(v => spunta(v.id)?.stato === 'parziale').length;\n  return { totale: voci.length, fatte, parziali, restanti: voci.length - fatte,\n           percento: voci.length ? Math.round(fatte / voci.length * 100) : 0 };\n}\n\nexport function biancheriaConScadenza(){\n  return (S.dati?.biancheria || []).map(b => {\n    const prossimo = piu(data(b.ultimo_cambio), b.ogni_giorni);\n    return { ...b, prossimo, giorni: scarto(prossimo), etichetta: scadenzaEtichetta(prossimo) };\n  }).sort((a, b) => a.giorni - b.giorni);\n}\n\nexport function attivitaConScadenza(){\n  return (S.dati?.attivita || []).filter(a => a.scadenza).map(a => {\n    const d = data(a.scadenza);\n    return { ...a, quando: d, giorni: scarto(d), etichetta: scadenzaEtichetta(d) };\n  }).sort((a, b) => a.giorni - b.giorni);\n}\n\n// Il riquadro rosso della home: tutto ciò che scade entro N giorni,\n// da tre moduli diversi, ordinato per urgenza.\nexport function scadenzeSettimana(giorni = 7){\n  const dentro = [];\n\n  biancheriaConScadenza().forEach(b => {\n    if (b.giorni <= giorni) dentro.push({\n      titolo: b.nome, sotto: 'Biancheria, ogni ' + b.ogni_giorni + ' giorni',\n      emoji: '🧺', modulo: 'pulizie', sezione: 'biancheria',\n      giorni: b.giorni, etichetta: b.etichetta\n    });\n  });\n\n  attivitaConScadenza().forEach(a => {\n    if (a.giorni <= giorni) dentro.push({\n      titolo: a.nome, sotto: (categoria(a.categoria_id)?.nome || 'Attività') + ' · ' + nomePersona(a.persona_id),\n      emoji: categoria(a.categoria_id)?.icona || '🔔', modulo: 'attivita', sezione: 'scadenze',\n      giorni: a.giorni, etichetta: a.etichetta\n    });\n  });\n\n  // Voci settimanali non ancora spuntate quando la settimana sta per chiudersi.\n  const fine = piu(new Date(S.settimana + 'T00:00:00'), 6);\n  if (scarto(fine) >= 0 && scarto(fine) <= 2) {\n    const mancanti = (S.dati?.pulizie.voci || []).filter(v => v.frequenza === 'settimanale' && !spunta(v.id));\n    if (mancanti.length) dentro.push({\n      titolo: mancanti.length + ' voci di pulizia da chiudere',\n      sotto: 'La settimana finisce ' + (scarto(fine) === 0 ? 'oggi' : 'tra ' + scarto(fine) + ' giorni'),\n      emoji: '🧽', modulo: 'pulizie', sezione: 'checklist',\n      giorni: scarto(fine), etichetta: scadenzaEtichetta(fine)\n    });\n  }\n\n  return dentro.sort((a, b) => a.giorni - b.giorni);\n}\n\nexport const urgenti = () => scadenzeSettimana().filter(s => s.etichetta.urgente);\n\nexport function spesaDaPrendere(){\n  return (S.dati?.spesa.articoli || []).filter(a => a.stato === 'da_prendere');\n}\n\nexport function eventiDelGiorno(quando = OGGI){\n  const g = iso(quando);\n  return (S.dati?.eventi || []).filter(e => e.inizio.slice(0,10) === g)\n    .sort((a, b) => a.inizio.localeCompare(b.inizio));\n}\n\n/* ---------- modifiche locali immediate ---------- */\n// L'interfaccia risponde subito, la scrittura sul database viaggia dopo.\n\nexport function applicaSpunta(voceId, stato, quando, personaId){\n  const arr = S.dati.pulizie.spunte;\n  const i = arr.findIndex(s => s.voce_id === voceId);\n  if (stato === null) { if (i >= 0) arr.splice(i, 1); }\n  else {\n    const riga = { voce_id: voceId, settimana: S.settimana, stato, data: iso(quando), persona_id: personaId };\n    i >= 0 ? arr[i] = riga : arr.push(riga);\n  }\n  avvisa();\n}\n\nexport function applicaCambioBiancheria(id, quando){\n  const b = S.dati.biancheria.find(x => x.id === id);\n  if (b) { b.ultimo_cambio = iso(quando); avvisa(); }\n}\n\nexport function applicaSpesa(id, campi){\n  const a = S.dati.spesa.articoli.find(x => x.id === id);\n  if (a) { Object.assign(a, campi); avvisa(); }\n}\n\nexport function aggiungiArticoloLocale(nome, quantita, categoriaId){\n  S.dati.spesa.articoli.push({\n    id: 'loc' + Date.now(), nome, quantita, categoria_id: categoriaId,\n    stato: 'da_prendere', origine: 'tablet'\n  });\n  avvisa();\n}\n\n/* ---------- registro ---------- */\nexport const registro = (modulo) =>\n  (S.dati?.registro || []).filter(r => !modulo || r.modulo === modulo);\n\nexport function aggiungiRegistroLocale(modulo, azione, dettaglio, personaId){\n  if (!S.dati.registro) S.dati.registro = [];\n  S.dati.registro.unshift({\n    modulo, azione, dettaglio, persona_id: personaId,\n    persona_nome: nomePersona(personaId), creato_il: new Date().toISOString()\n  });\n  avvisa();\n}\n\n/* ---------- categorie: creazione, modifica, eliminazione locale ---------- */\nexport function aggiungiCategoriaLocale(cat){\n  S.dati.categorie.push(cat); avvisa();\n}\nexport function modificaCategoriaLocale(id, campi){\n  const c = S.dati.categorie.find(x => x.id === id);\n  if (c) { Object.assign(c, campi); avvisa(); }\n}\nexport function rimuoviCategoriaLocale(id){\n  S.dati.categorie = S.dati.categorie.filter(c => c.id !== id); avvisa();\n}\n\n/* ---------- persone ---------- */\nexport function aggiungiPersonaLocale(p){ S.dati.persone.push(p); avvisa(); }\nexport function modificaPersonaLocale(id, campi){\n  const p = persona(id);\n  if (p) { Object.assign(p, campi); avvisa(); }\n}\n\n/* ---------- voci pulizie ---------- */\nexport function aggiungiVoceLocale(v){ S.dati.pulizie.voci.push(v); avvisa(); }\nexport function modificaVoceLocale(id, campi){\n  const v = S.dati.pulizie.voci.find(x => x.id === id);\n  if (v) { Object.assign(v, campi); avvisa(); }\n}\nexport function rimuoviVoceLocale(id){\n  S.dati.pulizie.voci = S.dati.pulizie.voci.filter(v => v.id !== id); avvisa();\n}\n\n/* ---------- biancheria: config ---------- */\nexport function aggiungiBiancheriaLocale(b){ S.dati.biancheria.push(b); avvisa(); }\nexport function modificaBiancheriaLocale(id, campi){\n  const b = S.dati.biancheria.find(x => x.id === id);\n  if (b) { Object.assign(b, campi); avvisa(); }\n}\nexport function rimuoviBiancheriaLocale(id){\n  S.dati.biancheria = S.dati.biancheria.filter(b => b.id !== id); avvisa();\n}\n\n/* ---------- ore lavorate: modifica e cancellazione righe storiche ---------- */\nexport function modificaOreLocale(id, campi){\n  const o = S.dati.pulizie.ore.find(x => String(x.id) === String(id));\n  if (o) { Object.assign(o, campi); avvisa(); }\n}\nexport function rimuoviOreLocale(id){\n  S.dati.pulizie.ore = S.dati.pulizie.ore.filter(o => String(o.id) !== String(id)); avvisa();\n}\n\n/* ---------- attività ---------- */\nexport function aggiungiAttivitaLocale(a){ S.dati.attivita.push(a); avvisa(); }\nexport function modificaAttivitaLocale(id, campi){\n  const a = S.dati.attivita.find(x => x.id === id);\n  if (a) { Object.assign(a, campi); avvisa(); }\n}\nexport function rimuoviAttivitaLocale(id){\n  S.dati.attivita = S.dati.attivita.filter(a => a.id !== id); avvisa();\n}\n\n/* ---------- eventi ---------- */\nexport function aggiungiEventoLocale(e){ S.dati.eventi.push(e); avvisa(); }\nexport function modificaEventoLocale(id, campi){\n  const e = S.dati.eventi.find(x => x.id === id);\n  if (e) { Object.assign(e, campi); avvisa(); }\n}\nexport function rimuoviEventoLocale(id){\n  S.dati.eventi = S.dati.eventi.filter(e => e.id !== id); avvisa();\n}\n\n/* ---------- spesa ricorrenti ---------- */\nexport function aggiungiRicorrenteLocale(r){ S.dati.spesa.ricorrenti.push(r); avvisa(); }\nexport function rimuoviRicorrenteLocale(id){\n  S.dati.spesa.ricorrenti = S.dati.spesa.ricorrenti.filter(r => r.id !== id); avvisa();\n}\n\n/* ---------- pagamenti ---------- */\n// Il conto di una persona: quanto dovuto dalle ore lavorate, quanto pagato,\n// e la differenza. Positiva = ha ricevuto di più (è a debito verso di te,\n// si scala dal prossimo pagamento). Negativa = deve ancora ricevere (è a credito).\nexport function contoPersona(personaId){\n  const ore = (S.dati?.pulizie.ore || []).filter(o => o.persona_id === personaId);\n  const p = persona(personaId);\n  const dovuto = ore.reduce((s, o) => s + o.ore * (o.tariffa_oraria ?? p?.tariffa_oraria ?? 0), 0);\n  const pagato = (S.dati?.pagamenti || [])\n    .filter(pg => pg.persona_id === personaId)\n    .reduce((s, pg) => s + Number(pg.importo), 0);\n  return {\n    oreTotali: ore.reduce((s, o) => s + o.ore, 0),\n    dovuto, pagato,\n    differenza: pagato - dovuto\n  };\n}\n\nexport const pagamentiDi = personaId =>\n  (S.dati?.pagamenti || []).filter(p => p.persona_id === personaId)\n    .sort((a, b) => b.data.localeCompare(a.data));\n\nexport function aggiungiPagamentoLocale(p){\n  if (!S.dati.pagamenti) S.dati.pagamenti = [];\n  S.dati.pagamenti.push(p); avvisa();\n}\nexport function modificaPagamentoLocale(id, campi){\n  const p = (S.dati.pagamenti || []).find(x => String(x.id) === String(id));\n  if (p) { Object.assign(p, campi); avvisa(); }\n}\nexport function rimuoviPagamentoLocale(id){\n  S.dati.pagamenti = (S.dati.pagamenti || []).filter(p => String(p.id) !== String(id)); avvisa();\n}\n", "/js/ui.js": "// Pezzi di interfaccia riusati da tutti i moduli.\n// Ogni funzione restituisce una stringa HTML: i moduli compongono, non manipolano.\n\nimport { esc, gm, $, $$ } from './util.js';\n\nexport const riq = (titolo, corpo, opzioni = {}) => `\n  <section class=\"riq ${opzioni.classe || ''}\" ${opzioni.colore ? `style=\"--c:${opzioni.colore}\"` : ''}>\n    ${titolo ? `<header><h3>${esc(titolo)}</h3>${opzioni.meta ? `<span class=\"meta\">${esc(opzioni.meta)}</span>` : ''}</header>` : ''}\n    <div class=\"dentro ${opzioni.raso ? 'raso' : ''}\">${corpo}</div>\n  </section>`;\n\nexport const riga = ({ titolo, sotto, destra, pill, urgente, dati = '' }) => `\n  <li class=\"${urgente ? 'urgente' : ''}\" ${dati}>\n    ${pill || ''}\n    <span class=\"tx\"><strong>${esc(titolo)}</strong>${sotto ? `<span>${esc(sotto)}</span>` : ''}</span>\n    ${destra ? `<span class=\"qd\">${destra}</span>` : ''}\n  </li>`;\n\nexport const pill = (testo, classe = 'neutra', colore) =>\n  `<span class=\"pill ${classe}\" ${colore ? `style=\"--c:${colore}\"` : ''}>${esc(testo)}</span>`;\n\nexport const vuoto = testo => `<p class=\"vuoto\">${esc(testo)}</p>`;\n\nexport function anello(percento, colore, misura = 62){\n  const r = (misura - 8) / 2, c = 2 * Math.PI * r;\n  return `<svg class=\"anello\" width=\"${misura}\" height=\"${misura}\" viewBox=\"0 0 ${misura} ${misura}\" style=\"--c:${colore}\">\n    <circle class=\"sfondo\" cx=\"${misura/2}\" cy=\"${misura/2}\" r=\"${r}\"></circle>\n    <circle class=\"avanti\" cx=\"${misura/2}\" cy=\"${misura/2}\" r=\"${r}\"\n      stroke-dasharray=\"${c}\" stroke-dashoffset=\"${c * (1 - percento/100)}\"></circle>\n  </svg>`;\n}\n\nexport const barra = (percento, colore) =>\n  `<div class=\"barra\" style=\"--c:${colore}\"><i style=\"width:${Math.max(0, Math.min(100, percento))}%\"></i></div>`;\n\nexport const tabella = (intestazioni, righe) => `\n  <table class=\"tab\"><thead><tr>${intestazioni.map(h => `<th>${esc(h)}</th>`).join('')}</tr></thead>\n  <tbody>${righe.join('')}</tbody></table>`;\n\nexport const interruttore = (acceso, colore, dati = '') =>\n  `<span class=\"sw ${acceso ? 'on' : ''}\" style=\"--c:${colore}\" ${dati}></span>`;\n\nexport const rigaCfg = (titolo, descrizione, controllo) => `\n  <li><span class=\"tx\"><strong>${esc(titolo)}</strong>${descrizione ? `<span>${esc(descrizione)}</span>` : ''}</span>${controllo}</li>`;\n\n/* ---------- modale della data ---------- */\n// Usata dalla checklist e dai cambi biancheria: pochi pulsanti, grandi.\n\nlet risolvi = null;\n\nexport function modaleData({ titolo, sottotitolo, persone = [], personaScelta, mostraTogli = true }){\n  const velo = $('#velo');\n  $('#foglio-titolo').textContent = titolo;\n  $('#foglio-sotto').textContent = sottotitolo || '';\n\n  const etichette = ['Oggi', 'Ieri', 'Due giorni fa', 'Tre giorni fa'];\n  $('#foglio-scelte').innerHTML = etichette.map((et, i) => {\n    const d = new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate() - i);\n    return `<button data-giorni=\"${-i}\">${et}<small>${gm(d)}</small></button>`;\n  }).join('');\n\n  $('#foglio-persone').innerHTML = persone.length ? `\n    <p class=\"occhiello\" style=\"margin:0 0 9px\">Chi l'ha fatta</p>\n    <div class=\"segmenti\" id=\"foglio-chi\">\n      ${persone.map(p => `<button data-persona=\"${p.id}\" class=\"${p.id === personaScelta ? 'on' : ''}\">${esc(p.nome)}</button>`).join('')}\n    </div>` : '';\n\n  $('#foglio-togli').style.display = mostraTogli ? '' : 'none';\n  const oggiIso = new Date().toISOString().slice(0,10);\n  $('#foglio-data').value = oggiIso;\n\n  velo.classList.add('on');\n  return new Promise(res => { risolvi = res; });\n}\n\nexport function chiudiModale(risposta = null){\n  $('#velo').classList.remove('on');\n  if (risolvi) { risolvi(risposta); risolvi = null; }\n}\n\n/* ---------- modulo generico di modifica ---------- */\n// Un solo modale per creare o modificare qualunque record: persone, categorie,\n// voci di checklist, biancheria, attività, eventi, articoli ricorrenti.\n// I campi sono descritti da uno schema, non c'è un modale diverso per ognuno.\n\nlet risolviForm = null;\n\nfunction campoHtml(c, valori){\n  const v = valori[c.nome] ?? c.difetto ?? '';\n  if (c.tipo === 'select') {\n    return `<select data-campo=\"${c.nome}\" ${c.richiesto ? 'required' : ''}>\n      ${c.opzioni.map(o => `<option value=\"${o.id}\" ${String(o.id) === String(v) ? 'selected' : ''}>${esc(o.nome)}</option>`).join('')}\n    </select>`;\n  }\n  if (c.tipo === 'numero') return `<input type=\"number\" data-campo=\"${c.nome}\" value=\"${esc(v)}\" min=\"${c.min ?? ''}\" step=\"${c.step || 1}\">`;\n  if (c.tipo === 'data')   return `<input type=\"date\" data-campo=\"${c.nome}\" value=\"${esc(v)}\">`;\n  return `<input type=\"text\" data-campo=\"${c.nome}\" value=\"${esc(v)}\" placeholder=\"${esc(c.placeholder||'')}\">`;\n}\n\nexport function modaleForm({ titolo, sottotitolo, campi, valori = {}, colore = 'var(--home)', permettiElimina = false }){\n  const velo = $('#velo2');\n  $('#foglio2-titolo').textContent = titolo;\n  $('#foglio2-sotto').textContent = sottotitolo || '';\n  $('#foglio2-campi').innerHTML = campi.map(c => `\n    <div class=\"campo-riga\">\n      <label>${esc(c.etichetta)}${c.richiesto ? ' *' : ''}</label>\n      ${campoHtml(c, valori)}\n    </div>`).join('');\n  $('#foglio2-conferma').style.background = colore;\n  $('#foglio2-elimina').style.display = permettiElimina ? '' : 'none';\n  velo.classList.add('on');\n  return new Promise(res => { risolviForm = res; });\n}\n\nexport function chiudiModaleForm(risultato = null){\n  $('#velo2').classList.remove('on');\n  if (risolviForm) { risolviForm(risultato); risolviForm = null; }\n}\n\nfunction leggiForm(){\n  const dati = {};\n  $$('#foglio2-campi [data-campo]').forEach(el => { dati[el.dataset.campo] = el.value; });\n  return dati;\n}\n\nexport function agganciaModaleForm(){\n  $('#foglio2-conferma').addEventListener('click', () => chiudiModaleForm({ azione: 'salva', valori: leggiForm() }));\n  $('#foglio2-elimina').addEventListener('click', () => chiudiModaleForm({ azione: 'elimina' }));\n  $('#foglio2-annulla').addEventListener('click', () => chiudiModaleForm(null));\n  $('#velo2').addEventListener('click', e => { if (e.target.id === 'velo2') chiudiModaleForm(null); });\n}\n\nexport function agganciaModale(){\n  const velo = $('#velo');\n  const chi = () => $('#foglio-chi .on')?.dataset.persona || null;\n\n  $('#foglio-scelte').addEventListener('click', e => {\n    const b = e.target.closest('button'); if (!b) return;\n    const d = new Date(); d.setHours(0,0,0,0);\n    d.setDate(d.getDate() + parseInt(b.dataset.giorni, 10));\n    chiudiModale({ azione: 'segna', data: d, persona: chi() });\n  });\n\n  $('#foglio-conferma').addEventListener('click', () => {\n    const v = $('#foglio-data').value;\n    if (v) chiudiModale({ azione: 'segna', data: new Date(v + 'T00:00:00'), persona: chi() });\n  });\n\n  $('#foglio-togli').addEventListener('click', () => chiudiModale({ azione: 'togli' }));\n  $('#foglio-chiudi').addEventListener('click', () => chiudiModale(null));\n  velo.addEventListener('click', e => { if (e.target === velo) chiudiModale(null); });\n\n  document.addEventListener('click', e => {\n    const b = e.target.closest('#foglio-chi button'); if (!b) return;\n    $('#foglio-chi').querySelectorAll('button').forEach(x => x.classList.remove('on'));\n    b.classList.add('on');\n  });\n\n  document.addEventListener('keydown', e => { if (e.key === 'Escape') chiudiModale(null); });\n}\n", "/js/util.js": "// Utilità comuni: date in italiano e scorciatoie per il DOM.\n\nexport const GG  = ['domenica','lunedì','martedì','mercoledì','giovedì','venerdì','sabato'];\nexport const GG3 = ['dom','lun','mar','mer','gio','ven','sab'];\nexport const MM  = ['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto',\n                    'settembre','ottobre','novembre','dicembre'];\n\nexport const inizioGiorno = d => { const x = new Date(d); x.setHours(0,0,0,0); return x; };\nexport const OGGI = inizioGiorno(new Date());\n\nexport const piu = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };\nexport const lunedi = (d = OGGI) => piu(inizioGiorno(d), -((inizioGiorno(d).getDay() + 6) % 7));\nexport const iso = d => new Date(d).toISOString().slice(0,10);\nexport const data = s => inizioGiorno(new Date(String(s).slice(0,10) + 'T00:00:00'));\nexport const scarto = d => Math.round((inizioGiorno(d) - OGGI) / 86400000);\n\nexport const gm = d => String(new Date(d).getDate()).padStart(2,'0') + '/' +\n                       String(new Date(d).getMonth()+1).padStart(2,'0');\nexport const breve = d => new Date(d).getDate() + ' ' + MM[new Date(d).getMonth()].slice(0,3);\n\nexport function relativa(d){\n  const n = scarto(d);\n  if (n === 0)  return 'oggi';\n  if (n === 1)  return 'domani';\n  if (n === -1) return 'ieri';\n  if (n < 0)    return -n + ' giorni fa';\n  if (n < 7)    return GG[new Date(d).getDay()];\n  return breve(d);\n}\n\n// Etichetta breve per le scadenze: \"in ritardo\", \"oggi\", \"tra 3 g\".\nexport function scadenzaEtichetta(d){\n  const n = scarto(d);\n  if (n < 0)  return { testo: n === -1 ? 'ieri' : -n + ' g di ritardo', classe: 'rossa', urgente: true };\n  if (n === 0) return { testo: 'oggi', classe: 'rossa', urgente: true };\n  if (n <= 2)  return { testo: 'tra ' + n + ' g', classe: 'ambra', urgente: false };\n  return { testo: 'tra ' + n + ' g', classe: 'neutra', urgente: false };\n}\n\nexport const $  = (s, r = document) => r.querySelector(s);\nexport const $$ = (s, r = document) => [...r.querySelectorAll(s)];\n\nexport const esc = s => String(s ?? '').replace(/[&<>\"]/g, c =>\n  ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '\"':'&quot;' }[c]));\n\nexport const plurale = (n, uno, tanti) => n + ' ' + (n === 1 ? uno : tanti);\n\nexport function avviso(testo){\n  let el = document.querySelector('.avviso');\n  if (!el) { el = document.createElement('div'); el.className = 'avviso'; document.body.appendChild(el); }\n  el.textContent = testo;\n  requestAnimationFrame(() => el.classList.add('on'));\n  clearTimeout(el._t);\n  el._t = setTimeout(() => el.classList.remove('on'), 2600);\n}\n"};
const fatti = new Map();

function risolvi(base, spec){
  if (!spec.startsWith('.')) return spec;
  const parti = base.split('/').slice(0, -1);
  for (const p of spec.split('/')) {
    if (p === '.') continue;
    else if (p === '..') parti.pop();
    else parti.push(p);
  }
  return parti.join('/');
}

function costruisci(percorso){
  if (fatti.has(percorso)) return fatti.get(percorso);
  let codice = SORGENTI[percorso];
  if (codice === undefined) throw new Error('Modulo mancante: ' + percorso);

  // prima le dipendenze, poi si riscrivono gli indirizzi
  codice = codice.replace(/(from\s*|import\s*\(\s*)['"]([^'"]+)['"]/g, (tutto, prima, spec) => {
    const p = risolvi(percorso, spec);
    return SORGENTI[p] !== undefined ? prima + "'" + costruisci(p) + "'" : tutto;
  });

  const url = URL.createObjectURL(new Blob([codice], { type: 'text/javascript' }));
  fatti.set(percorso, url);
  return url;
}

import(costruisci('/js/app.js')).catch(e => {
  document.getElementById('corpo').innerHTML =

});
