<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Casa Ferrafoni">
<meta name="theme-color" content="#16222C">

<title>Ferrafoni Home Planner</title>


<style>
  /* griglia della settimana, usata solo dal modulo calendario */
  .sett{display:grid;grid-template-columns:repeat(7,1fr)}
  .giorno{border-right:1px solid var(--linea-tenue);min-height:210px;padding:11px 10px}
  .giorno:last-child{border-right:0}
  .giorno.oggi{background:#F5F2E9}
  .giorno h4{font-size:.79rem;color:var(--tenue);font-weight:500;margin-bottom:10px}
  .giorno h4 b{display:block;font-size:1.1rem;color:var(--testo);font-weight:600;font-variant-numeric:tabular-nums}
  .ev{border-radius:8px;padding:8px 9px;margin-bottom:7px;font-size:.76rem;line-height:1.35;
      background:color-mix(in srgb,var(--ec) 13%,transparent);border-left:3px solid var(--ec);color:#25333D}
  .ev b{display:block;font-weight:600}
  .ev span{color:var(--tenue)}
</style>
<style>
/* ============================================================
   Ferrafoni Home Planner — fondamenta
   ============================================================ */

:root{
  /* superfici */
  --inchiostro:#16222C;
  --inchiostro-alto:#22323F;
  --inchiostro-basso:#0E1920;
  --carta:#EBE8DF;
  --pannello:#FCFBF8;
  --linea:#DAD5C8;
  --linea-tenue:#E7E3D8;

  /* testo */
  --testo:#1E2C36;
  --tenue:#6C7883;
  --tenue-chiaro:#8FA0AC;

  /* moduli */
  --pulizie:#2F7D6D;
  --calendario:#3D5BA9;
  --spesa:#B9741F;
  --attivita:#9C3A5E;
  --home:#4A5A64;

  /* segnali */
  --rosso:#BE3227;
  --rosso-fondo:#FBEDE9;
  --ambra:#C58312;
  --ambra-fondo:#FBF1DC;
  --verde:#2F7D6D;

  /* forma */
  --raggio:14px;
  --raggio-p:10px;
  --colonna:250px;

  /* profondità */
  --ombra-1:0 1px 2px rgba(22,34,44,.05), 0 2px 6px rgba(22,34,44,.04);
  --ombra-2:0 2px 4px rgba(22,34,44,.06), 0 8px 20px rgba(22,34,44,.08);
  --ombra-3:0 10px 24px rgba(22,34,44,.10), 0 30px 60px rgba(22,34,44,.12);

  --accento:var(--home);
  --scala:1;
}

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--carta);
  color:var(--testo);
  font-family:"Helvetica Neue",Helvetica,Arial,system-ui,sans-serif;
  font-size:calc(15.5px * var(--scala));
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
  -webkit-tap-highlight-color:transparent;
}
body.testo-grande{--scala:1.12}

button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-appearance:none}
:focus-visible{outline:2.5px solid var(--accento);outline-offset:2px;border-radius:6px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#CFC9BA;border-radius:5px;border:3px solid var(--carta)}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- tipografia ---------- */
h1,h2,h3,h4{margin:0;letter-spacing:-.022em}
.titolo-x{font-size:1.65rem;font-weight:700;letter-spacing:-.032em}
.titolo{font-size:1.08rem;font-weight:600}
.occhiello{font-size:.8rem;color:var(--tenue)}
.numero{font-variant-numeric:tabular-nums}

/* ---------- bottoni ---------- */
.btn{
  height:50px;padding:0 20px;border-radius:11px;background:var(--accento);color:#fff;
  font-size:.95rem;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:9px;
  box-shadow:var(--ombra-1);transition:transform .12s ease,filter .14s ease,box-shadow .14s ease;
}
.btn:hover{filter:brightness(1.07);box-shadow:var(--ombra-2)}
.btn:active{transform:scale(.97)}
.btn.chiaro{background:var(--pannello);color:var(--testo);border:1px solid var(--linea)}
.btn.chiaro:hover{filter:none;background:#fff}
.btn.piccolo{height:42px;padding:0 15px;font-size:.88rem;border-radius:9px}
.btn.pieno{width:100%}

/* ---------- etichette ---------- */
.pill{
  display:inline-flex;align-items:center;gap:6px;height:27px;padding:0 10px;border-radius:8px;
  font-size:.79rem;font-weight:600;white-space:nowrap;
  background:color-mix(in srgb,var(--c,var(--tenue)) 13%,transparent);color:var(--c,var(--tenue));
}
.pill.neutra{background:#EEEBE3;color:var(--tenue)}
.pill.rossa{background:var(--rosso-fondo);color:var(--rosso)}
.pill.ambra{background:var(--ambra-fondo);color:#8C5C05}
.pill.verde{background:#E2EFEA;color:var(--verde)}

/* ---------- interruttore ---------- */
.sw{width:56px;height:33px;border-radius:17px;background:#D8D2C4;position:relative;flex:none;
  transition:background .2s ease;box-shadow:inset 0 1px 2px rgba(0,0,0,.07)}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:27px;height:27px;border-radius:50%;
  background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s cubic-bezier(.3,1.4,.5,1)}
.sw.on{background:var(--c,var(--accento))}
.sw.on::after{transform:translateX(23px)}

/* ---------- campi ---------- */
select,input[type=text],input[type=number],input[type=time],input[type=date],input[type=password]{
  font:inherit;font-size:.95rem;height:50px;padding:0 14px;border:1px solid var(--linea);
  border-radius:11px;background:#fff;color:var(--testo);min-width:150px;
}
input:focus,select:focus{border-color:var(--accento)}
input[type=text]{min-width:200px}

/* ---------- barre e anelli ---------- */
.barra{height:8px;border-radius:5px;background:#E4E0D5;overflow:hidden}
.barra i{display:block;height:100%;border-radius:5px;background:var(--c,var(--accento));
  transition:width .45s cubic-bezier(.2,.8,.3,1)}
.anello{transform:rotate(-90deg)}
.anello circle{fill:none;stroke-width:7;stroke-linecap:round}
.anello .sfondo{stroke:#E4E0D5}
.anello .avanti{stroke:var(--c,var(--accento));transition:stroke-dashoffset .6s cubic-bezier(.2,.8,.3,1)}

/* ---------- segmenti ---------- */
.segmenti{display:inline-flex;background:#E3DFD4;border-radius:12px;padding:4px;gap:2px}
.segmenti button{padding:10px 17px;font-size:.88rem;color:var(--tenue);border-radius:9px;
  font-weight:500;transition:background .16s,color .16s,box-shadow .16s}
.segmenti button.on{background:var(--pannello);color:var(--testo);box-shadow:var(--ombra-1)}

/* ---------- comparsa ---------- */
@keyframes sali{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.entra{animation:sali .34s cubic-bezier(.2,.8,.3,1) both}

/* ============================================================
   Ferrafoni Home Planner — impianto
   ============================================================ */

.app{display:grid;grid-template-columns:var(--colonna) 1fr;height:100vh;height:100dvh}
.app.concentrato{grid-template-columns:0 1fr}
.app.concentrato .colonna{display:none}

/* ---------- colonna moduli ---------- */
.colonna{
  background:linear-gradient(180deg,#1B2833 0%,var(--inchiostro) 38%,var(--inchiostro-basso) 100%);
  color:#E5EAEE;display:flex;flex-direction:column;padding:22px 0 14px;overflow-y:auto;
}
.marchio{padding:0 20px 20px;margin-bottom:14px;border-bottom:1px solid rgba(255,255,255,.08)}
.marchio .casa{display:inline-flex;align-items:center;gap:8px;font-size:.78rem;color:var(--tenue-chiaro);margin-bottom:9px}
.punto{width:8px;height:8px;border-radius:50%;background:#5FBF9E;box-shadow:0 0 0 4px rgba(95,191,158,.16)}
.marchio h1{font-size:1.3rem;font-weight:700;color:#fff}
.marchio p{margin:4px 0 0;font-size:.78rem;color:#6E7F8C}

.voci{list-style:none;margin:0;padding:0 12px;display:grid;gap:4px}
.voce{
  width:100%;display:flex;align-items:center;gap:13px;padding:14px 14px;border-radius:12px;
  text-align:left;font-size:.97rem;color:#C4CED5;transition:background .16s,color .16s;
}
.voce .emj{font-size:1.15rem;width:26px;text-align:center;flex:none;filter:saturate(.85)}
.voce .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.voce .bdg{min-width:24px;height:24px;padding:0 7px;border-radius:12px;background:rgba(255,255,255,.11);
  color:#B7C4CC;font-size:.75rem;font-weight:600;display:flex;align-items:center;justify-content:center}
.voce .bdg.caldo{background:var(--rosso);color:#fff;box-shadow:0 0 0 4px rgba(190,50,39,.18)}
.voce:hover{background:rgba(255,255,255,.06);color:#fff}
.voce.on{background:var(--c);color:#fff;box-shadow:var(--ombra-2)}
.voce.on .bdg{background:rgba(255,255,255,.22);color:#fff}

.piede{margin-top:auto;padding:14px 20px 0;border-top:1px solid rgba(255,255,255,.08);display:grid;gap:4px}
.piede button{display:flex;align-items:center;gap:10px;font-size:.85rem;color:#9AA9B4;padding:10px 0;text-align:left}
.piede button:hover{color:#fff}
.stato-rete{display:flex;align-items:center;gap:8px;font-size:.74rem;color:#657785;padding-top:6px}

/* ---------- testata ---------- */
.principale{display:flex;flex-direction:column;min-width:0;overflow:hidden}
.testata{display:flex;align-items:center;justify-content:space-between;gap:20px;
  padding:16px 26px;border-bottom:1px solid var(--linea);background:rgba(235,232,223,.85);backdrop-filter:blur(8px)}
.testata .sx{min-width:0}
.testata .data{font-size:.85rem;color:var(--tenue);text-align:right;line-height:1.3}
.testata .data b{display:block;color:var(--testo);font-size:1rem}
.facce{display:flex}
.faccia{width:38px;height:38px;border-radius:50%;border:2.5px solid var(--carta);margin-left:-10px;
  display:flex;align-items:center;justify-content:center;font-size:.76rem;font-weight:700;color:#fff}
.azioni{display:flex;align-items:center;gap:16px}

.tabs{display:flex;gap:6px;padding:12px 26px 0}
.tabs button{padding:11px 16px;border-radius:11px 11px 0 0;font-size:.92rem;color:var(--tenue);font-weight:500;
  border-bottom:3px solid transparent;transition:.16s}
.tabs button:hover{color:var(--testo)}
.tabs button.on{color:var(--c);border-bottom-color:var(--c);background:rgba(255,255,255,.5)}

.scorri{flex:1;overflow-y:auto;padding:20px 26px 44px;-webkit-overflow-scrolling:touch}

/* ---------- riquadri ---------- */
.riq{background:var(--pannello);border:1px solid var(--linea);border-radius:var(--raggio);
  overflow:hidden;box-shadow:var(--ombra-1)}
.riq>header{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:15px 18px;border-bottom:1px solid var(--linea-tenue)}
.riq>header h3{font-size:1rem;font-weight:600}
.riq>header .meta{font-size:.8rem;color:var(--tenue)}
.riq .dentro{padding:16px 18px}
.riq .dentro.raso{padding:0}
.riq.tinta>header{box-shadow:inset 3px 0 0 var(--c)}
.riq.allarme{border-color:#EBCEC8;box-shadow:0 0 0 3px rgba(190,50,39,.05),var(--ombra-1)}

.griglia{display:grid;gap:18px}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}
.g-lato{grid-template-columns:1.65fr 1fr}
@media(max-width:1120px){.g3,.g-lato{grid-template-columns:1fr 1fr}}

/* ---------- righe ---------- */
.righe{list-style:none;margin:0;padding:0}
.righe li{display:flex;align-items:center;gap:13px;padding:13px 18px;
  border-bottom:1px solid var(--linea-tenue);min-height:60px}
.righe li:last-child{border-bottom:0}
.righe .tx{flex:1;min-width:0}
.righe .tx strong{display:block;font-weight:500;font-size:.95rem}
.righe .tx span{display:block;font-size:.8rem;color:var(--tenue);margin-top:2px}
.righe .qd{font-size:.85rem;color:var(--tenue);white-space:nowrap;font-variant-numeric:tabular-nums}
.righe li.urgente{background:linear-gradient(90deg,var(--rosso-fondo),transparent 70%)}
.righe li.urgente .tx strong{color:var(--rosso)}
.righe li.urgente .qd{color:var(--rosso);font-weight:600}

/* ---------- home a cascata ---------- */
.urgenze{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-bottom:20px}
.urg{
  background:var(--pannello);border:1px solid #EBCEC8;border-left:5px solid var(--rosso);
  border-radius:var(--raggio-p);padding:14px 16px;box-shadow:var(--ombra-1);
  display:flex;align-items:center;gap:12px;text-align:left;transition:transform .14s,box-shadow .14s;
}
.urg:hover{transform:translateY(-2px);box-shadow:var(--ombra-2)}
.urg .emj{font-size:1.4rem}
.urg b{display:block;font-size:.95rem;color:var(--rosso)}
.urg span{display:block;font-size:.8rem;color:var(--tenue);margin-top:1px}
.urgenze.vuota{grid-template-columns:1fr}
.urg.calma{border-color:var(--linea);border-left-color:var(--verde)}
.urg.calma b{color:var(--verde)}

.cascata{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.tessera{
  background:var(--pannello);border:1px solid var(--linea);border-radius:var(--raggio);
  box-shadow:var(--ombra-1);overflow:hidden;text-align:left;
  transition:box-shadow .2s ease,transform .2s ease,border-color .2s ease;
}
.tessera:hover{box-shadow:var(--ombra-2);transform:translateY(-2px)}
.tessera.aperta{grid-column:1/-1;box-shadow:var(--ombra-3);border-color:color-mix(in srgb,var(--c) 40%,var(--linea))}
.tessera>.testa{display:flex;align-items:center;gap:15px;padding:18px;width:100%;text-align:left;
  border-top:4px solid var(--c)}
.tessera .emj{font-size:1.5rem;width:44px;height:44px;border-radius:12px;flex:none;
  display:flex;align-items:center;justify-content:center;
  background:color-mix(in srgb,var(--c) 12%,transparent)}
.tessera .info{flex:1;min-width:0}
.tessera .info b{display:block;font-size:1.02rem;font-weight:600}
.tessera .info span{display:block;font-size:.83rem;color:var(--tenue);margin-top:2px}
.tessera .cifra{font-size:1.9rem;font-weight:700;letter-spacing:-.04em;color:var(--c);
  font-variant-numeric:tabular-nums;line-height:1}
.tessera .freccia{width:11px;height:11px;border-right:2px solid var(--tenue);border-bottom:2px solid var(--tenue);
  transform:rotate(45deg);transition:transform .25s ease;flex:none;margin-left:4px}
.tessera.aperta .freccia{transform:rotate(-135deg)}

.tessera .corpo{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s cubic-bezier(.2,.8,.3,1)}
.tessera.aperta .corpo{grid-template-rows:1fr}
.tessera .corpo>div{overflow:hidden}
.tessera .corpo .righe{border-top:1px solid var(--linea-tenue)}
.tessera .piedino{display:flex;justify-content:space-between;align-items:center;gap:10px;
  padding:13px 18px;border-top:1px solid var(--linea-tenue);background:#F7F5EE}

/* ---------- checklist ---------- */
.settimana-barra{display:flex;align-items:center;gap:14px;padding:13px 16px;background:var(--pannello);
  border:1px solid var(--linea);border-radius:var(--raggio);margin-bottom:18px;box-shadow:var(--ombra-1)}
.settimana-barra .nav{width:52px;height:52px;border-radius:13px;border:1px solid var(--linea);
  background:#fff;display:flex;align-items:center;justify-content:center;font-size:1.4rem;color:var(--tenue)}
.settimana-barra .nav:hover{background:#F5F2EA;color:var(--testo)}
.settimana-barra .et{flex:1;min-width:0}
.settimana-barra .et b{display:block;font-size:1.12rem;font-weight:600}
.settimana-barra .et span{font-size:.82rem;color:var(--tenue)}

.gruppo{border-bottom:1px solid var(--linea-tenue)}
.gruppo:last-child{border-bottom:0}
.gruppo>.capo{display:flex;align-items:center;gap:12px;width:100%;padding:14px 18px;
  background:#F5F2EA;text-align:left;transition:background .15s}
.gruppo>.capo:hover{background:#F0ECE2}
.gruppo>.capo .emj{font-size:1.1rem}
.gruppo>.capo b{flex:1;font-size:.93rem;font-weight:600}
.gruppo>.capo .avanz{font-size:.8rem;color:var(--tenue);font-variant-numeric:tabular-nums}
.gruppo>.capo .freccia{width:10px;height:10px;border-right:2px solid var(--tenue);border-bottom:2px solid var(--tenue);
  transform:rotate(45deg);transition:transform .25s}
.gruppo.aperto>.capo .freccia{transform:rotate(-135deg)}
.gruppo .elenco{display:grid;grid-template-rows:0fr;transition:grid-template-rows .28s cubic-bezier(.2,.8,.3,1)}
.gruppo.aperto .elenco{grid-template-rows:1fr}
.gruppo .elenco>div{overflow:hidden}

.compito{display:flex;align-items:center;gap:14px;padding:12px 18px;border-bottom:1px solid var(--linea-tenue);min-height:74px}
.compito:last-child{border-bottom:0}
.compito .emj{font-size:1.25rem;width:30px;text-align:center;flex:none}
.compito .tx{flex:1;min-width:0}
.compito .tx strong{display:block;font-size:1rem;font-weight:500}
.compito .tx span{display:block;font-size:.8rem;color:var(--tenue);margin-top:2px}
.compito .quando{min-width:132px;text-align:right;font-size:.8rem;color:var(--tenue);
  padding:8px 10px;border-radius:9px;font-variant-numeric:tabular-nums;transition:background .15s}
.compito .quando b{display:block;color:var(--testo);font-size:.92rem;font-weight:600}
.compito .quando:hover{background:#F1EEE6}
.compito.fatto{background:linear-gradient(90deg,rgba(47,125,109,.07),transparent 60%)}
.compito.scaduto .tx strong,.compito.scaduto .tx span{color:var(--rosso)}
.segna{display:flex;gap:9px;flex:none}
.segna button{height:54px;min-width:104px;padding:0 16px;border-radius:12px;border:1.5px solid var(--linea);
  background:#fff;font-size:.94rem;font-weight:600;color:var(--tenue);
  transition:transform .12s,background .15s,color .15s,border-color .15s}
.segna button:active{transform:scale(.95)}
.segna button.f-on{background:var(--pulizie);border-color:var(--pulizie);color:#fff;box-shadow:var(--ombra-1)}
.segna button.p-on{background:var(--ambra);border-color:var(--ambra);color:#fff;box-shadow:var(--ombra-1)}

/* ---------- tabelle ---------- */
.tab{width:100%;border-collapse:collapse}
.tab th,.tab td{padding:14px 16px;text-align:left;border-bottom:1px solid var(--linea-tenue);font-size:.92rem}
.tab th{font-size:.8rem;font-weight:600;color:var(--tenue);background:#F5F2EA}
.tab tr:last-child td{border-bottom:0}
.tab .sm{display:block;font-size:.79rem;color:var(--tenue)}
.tab td.num{font-variant-numeric:tabular-nums}

/* ---------- impostazioni ---------- */
.cfg{list-style:none;margin:0;padding:0}
.cfg li{display:flex;align-items:center;gap:20px;padding:16px 18px;border-bottom:1px solid var(--linea-tenue);min-height:72px}
.cfg li:last-child{border-bottom:0}
.cfg .tx{flex:1;min-width:0}
.cfg .tx strong{display:block;font-weight:500;font-size:.95rem}
.cfg .tx span{display:block;font-size:.82rem;color:var(--tenue);margin-top:3px;max-width:60ch}
.etichette{display:flex;flex-wrap:wrap;gap:9px}
.et-i{display:inline-flex;align-items:center;gap:9px;height:46px;padding:0 15px;border-radius:12px;
  border:1px solid var(--linea);background:#fff;font-size:.9rem}
.et-i.aggiungi{border-style:dashed;color:var(--tenue)}
.nota{margin:14px 0 0;font-size:.82rem;color:var(--tenue);max-width:74ch}
code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.82rem;
  background:#EEEBE3;padding:2px 6px;border-radius:5px}

/* ---------- spesa ---------- */
.art{display:flex;align-items:center;gap:14px;padding:12px 18px;border-bottom:1px solid var(--linea-tenue);min-height:64px}
.art:last-child{border-bottom:0}
.spunta{width:30px;height:30px;border-radius:9px;border:2px solid var(--linea);background:#fff;flex:none;
  display:flex;align-items:center;justify-content:center;transition:.15s}
.spunta.on{background:var(--spesa);border-color:var(--spesa)}
.spunta.on::after{content:"";width:12px;height:6px;border-left:2.5px solid #fff;border-bottom:2.5px solid #fff;
  transform:rotate(-45deg) translate(1px,-2px)}
.art.preso .tx strong{color:var(--tenue);text-decoration:line-through}

/* ---------- telefono finto ---------- */
.telefono{width:300px;border-radius:38px;border:10px solid #17181A;background:#0E1216;padding:18px 14px 22px;
  color:#fff;margin:0 auto;box-shadow:var(--ombra-3)}
.telefono .sbarra{display:flex;justify-content:space-between;font-size:.7rem;color:#93A0A9;padding:0 8px 18px}
.telefono .dom{font-size:.98rem;font-weight:600;text-align:center;padding:0 8px 18px;line-height:1.4}
.telefono .sc{background:#242B33;border-radius:14px;padding:15px;margin-bottom:10px;font-size:.94rem;
  display:flex;align-items:center;gap:11px}
.telefono .sc.pri{background:var(--spesa)}

/* ---------- modale ---------- */
.velo{position:fixed;inset:0;background:rgba(14,25,32,.55);display:none;align-items:center;justify-content:center;
  z-index:60;padding:24px;backdrop-filter:blur(3px)}
.velo.on{display:flex;animation:sali .2s ease both}
.foglio{background:var(--pannello);border-radius:20px;width:560px;max-width:100%;overflow:hidden;box-shadow:var(--ombra-3)}
.foglio header{padding:22px 24px 6px}
.foglio header h3{font-size:1.25rem;font-weight:600}
.foglio header p{margin:6px 0 0;font-size:.87rem;color:var(--tenue)}
.foglio .scelte{padding:18px 24px;display:grid;grid-template-columns:1fr 1fr;gap:11px}
.foglio .scelte button{height:72px;border-radius:14px;border:1.5px solid var(--linea);background:#fff;
  font-size:1rem;font-weight:600;transition:.15s}
.foglio .scelte button:hover{border-color:var(--pulizie);color:var(--pulizie)}
.foglio .scelte button small{display:block;font-size:.78rem;color:var(--tenue);font-weight:400;margin-top:3px}
.foglio .riga-campo{display:flex;gap:11px;align-items:center;padding:0 24px 18px}
.foglio .riga-campo input{flex:1}
.foglio .persone{padding:0 24px 20px}
.foglio footer{display:flex;gap:11px;justify-content:flex-end;padding:16px 24px;
  border-top:1px solid var(--linea-tenue);background:#F5F2EA}

/* ---------- avviso ---------- */
.avviso{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(120%);
  background:var(--inchiostro);color:#fff;padding:14px 22px;border-radius:13px;font-size:.92rem;
  box-shadow:var(--ombra-3);z-index:70;transition:transform .3s cubic-bezier(.2,.9,.3,1)}
.avviso.on{transform:translateX(-50%) translateY(0)}

.vuoto{padding:34px 18px;text-align:center;color:var(--tenue);font-size:.88rem}

/* ---------- modale generico di modifica ---------- */
.campi-form{padding:6px 24px 20px;display:grid;gap:14px;max-height:60vh;overflow-y:auto}
.campo-riga{display:grid;gap:7px}
.campo-riga label{font-size:.82rem;color:var(--tenue);font-weight:500}
.campo-riga select,.campo-riga input{width:100%}

/* ---------- registro ---------- */
.log-riga{display:flex;align-items:center;gap:13px;padding:12px 18px;border-bottom:1px solid var(--linea-tenue)}
.log-riga:last-child{border-bottom:0}
.log-punto{width:9px;height:9px;border-radius:50%;background:var(--c,var(--tenue));flex:none}
.log-riga .tx{flex:1;min-width:0}
.log-riga .tx strong{font-weight:500;font-size:.92rem}
.log-riga .tx span{display:block;font-size:.79rem;color:var(--tenue);margin-top:1px}
.log-riga .qd{font-size:.78rem;color:var(--tenue);white-space:nowrap;text-align:right}

/* ---------- pulsanti riga con azioni ---------- */
.riga-azioni{display:flex;gap:8px;flex:none}
.riga-azioni button{width:38px;height:38px;border-radius:9px;border:1px solid var(--linea);
  background:#fff;font-size:.95rem;color:var(--tenue)}
.riga-azioni button:hover{background:#F5F2EA;color:var(--testo)}

</style>
</head>
<body>

<div class="app" id="app">

  <nav class="colonna" aria-label="Moduli">
    <div class="marchio">
      <div class="casa"><span class="punto"></span> Casa Ferrafoni</div>
      <h1>Home Planner</h1>
      <p>Davide, Vivien, Amelie e Maddie</p>
    </div>
    <ul class="voci" id="voci"></ul>
    <div class="piede">
      <button id="modo-pulizie">🧽 Vista per chi pulisce</button>
      <button id="vai-generali">⚙️ Casa e famiglia</button>
      <div class="stato-rete" id="stato-rete"></div>
    </div>
  </nav>

  <div class="principale">
    <header class="testata">
      <div class="sx">
        <p class="occhiello" id="occhiello">Panoramica</p>
        <h2 class="titolo-x" id="titolo">Oggi</h2>
      </div>
      <div class="azioni">
        <div class="facce" id="facce"></div>
        <div class="data" id="data-oggi"></div>
        <button class="btn chiaro" id="esci-modo" style="display:none">Chiudi vista pulizie</button>
      </div>
    </header>

    <div class="tabs" id="schede"></div>

    <div class="scorri" id="scorri">
      <div id="corpo"><p class="vuoto">Carico i dati di casa…</p></div>
    </div>
  </div>
</div>

<!-- modale della data, condivisa da checklist e biancheria -->
<div class="velo" id="velo">
  <div class="foglio" role="dialog" aria-modal="true">
    <header>
      <h3 id="foglio-titolo"></h3>
      <p id="foglio-sotto"></p>
    </header>
    <div class="scelte" id="foglio-scelte"></div>
    <div class="riga-campo">
      <input type="date" id="foglio-data">
      <button class="btn chiaro" id="foglio-conferma">Usa questa data</button>
    </div>
    <div class="persone" id="foglio-persone"></div>
    <footer>
      <button class="btn chiaro" id="foglio-togli">Togli la spunta</button>
      <button class="btn" style="background:var(--pulizie)" id="foglio-chiudi">Chiudi</button>
    </footer>
  </div>
</div>

<!-- modale generico: crea o modifica qualunque record -->
<div class="velo" id="velo2">
  <div class="foglio" role="dialog" aria-modal="true">
    <header>
      <h3 id="foglio2-titolo"></h3>
      <p id="foglio2-sotto"></p>
    </header>
    <div class="campi-form" id="foglio2-campi"></div>
    <footer>
      <button class="btn chiaro" id="foglio2-elimina" style="display:none;margin-right:auto;color:var(--rosso)">Elimina</button>
      <button class="btn chiaro" id="foglio2-annulla">Annulla</button>
      <button class="btn" id="foglio2-conferma">Salva</button>
    </footer>
  </div>
</div>


<script>
const SORGENTI = {"/js/api.js": "// Client delle API. Se il backend non risponde l'app continua a funzionare\n// con i dati dimostrativi e segnala lo stato nella colonna di sinistra.\n\nimport { demo } from './demo.js';\n\nconst CHIAVE = 'ferrafoni.chiave';\n\nexport const rete = { collegata: false, ultimo: null, motivo: 'non provata' };\n\nexport const chiave     = ()  => localStorage.getItem(CHIAVE) || '';\nexport const salvaChiave = v  => localStorage.setItem(CHIAVE, v || '');\n\nasync function chiama(percorso, opzioni = {}){\n  const r = await fetch('/api' + percorso, {\n    ...opzioni,\n    headers: {\n      'content-type': 'application/json',\n      ...(chiave() ? { 'x-casa-chiave': chiave() } : {}),\n      ...(opzioni.headers || {})\n    }\n  });\n  if (!r.ok) throw new Error('HTTP ' + r.status);\n  return r.json();\n}\n\nexport async function caricaStato(settimana){\n  try {\n    const d = await chiama('/stato?settimana=' + settimana);\n    rete.collegata = true; rete.ultimo = new Date(); rete.motivo = 'collegata';\n    return d;\n  } catch (e) {\n    rete.collegata = false; rete.motivo = 'dati locali';\n    return demo(settimana);\n  }\n}\n\n// Ogni scrittura aggiorna comunque lo stato in memoria: se la rete manca,\n// l'app resta usabile e la modifica resta visibile fino al ricaricamento.\nexport const api = {\n  spuntaPulizia : d => chiama('/pulizie/spunte', { method:'POST', body: JSON.stringify(d) }),\n  togliSpunta   : (voce, settimana) =>\n    chiama(`/pulizie/spunte?voce_id=${voce}&settimana=${settimana}`, { method:'DELETE' }),\n  aggiungiOre   : d => chiama('/pulizie/ore', { method:'POST', body: JSON.stringify(d) }),\n  cambioBiancheria: d => chiama('/biancheria', { method:'POST', body: JSON.stringify(d) }),\n  aggiungiSpesa : d => chiama('/spesa', { method:'POST', body: JSON.stringify(d) }),\n  modificaSpesa : (id, d) => chiama('/spesa/' + id, { method:'PATCH', body: JSON.stringify(d) }),\n  rimuoviSpesa  : id => chiama('/spesa/' + id, { method:'DELETE' }),\n  attivitaFatta : id => chiama('/attivita', { method:'PATCH', body: JSON.stringify({ id, fatta:true }) }),\n  salvaImpostazioni: (modulo, valori) =>\n    chiama('/impostazioni', { method:'PUT', body: JSON.stringify({ modulo, valori }) }),\n\n  // categorie\n  creaCategoria   : d => chiama('/categorie', { method:'POST', body: JSON.stringify(d) }),\n  modificaCategoria: d => chiama('/categorie', { method:'PATCH', body: JSON.stringify(d) }),\n  eliminaCategoria: id => chiama('/categorie?id=' + id, { method:'DELETE' }),\n\n  // persone\n  creaPersona     : d => chiama('/persone', { method:'POST', body: JSON.stringify(d) }),\n  modificaPersona : d => chiama('/persone', { method:'PATCH', body: JSON.stringify(d) }),\n\n  // voci pulizie\n  creaVoce        : d => chiama('/pulizie/voci', { method:'POST', body: JSON.stringify(d) }),\n  modificaVoce    : d => chiama('/pulizie/voci', { method:'PATCH', body: JSON.stringify(d) }),\n  eliminaVoce     : id => chiama('/pulizie/voci?id=' + id, { method:'DELETE' }),\n\n  // biancheria: configurazione e storico\n  salvaBiancheria : d => chiama('/biancheria', { method:'PUT', body: JSON.stringify(d) }),\n  eliminaBiancheria: id => chiama('/biancheria?id=' + id, { method:'DELETE' }),\n  storicoBiancheria: id => chiama('/biancheria?storico=' + id),\n  eliminaCambioBiancheria: cambioId => chiama('/biancheria?cambio=' + cambioId, { method:'DELETE' }),\n\n  // ore lavorate\n  modificaOre     : d => chiama('/pulizie/ore', { method:'PATCH', body: JSON.stringify(d) }),\n  eliminaOre      : id => chiama('/pulizie/ore?id=' + id, { method:'DELETE' }),\n\n  // attività\n  creaAttivita    : d => chiama('/attivita', { method:'POST', body: JSON.stringify(d) }),\n  modificaAttivita: d => chiama('/attivita', { method:'PATCH', body: JSON.stringify(d) }),\n  eliminaAttivita : id => chiama('/attivita?id=' + id, { method:'DELETE' }),\n\n  // eventi\n  creaEvento      : d => chiama('/eventi', { method:'POST', body: JSON.stringify(d) }),\n  modificaEvento  : d => chiama('/eventi', { method:'PATCH', body: JSON.stringify(d) }),\n  eliminaEvento   : id => chiama('/eventi?id=' + id, { method:'DELETE' }),\n\n  // spesa ricorrenti\n  creaRicorrente  : d => chiama('/spesa/ricorrenti', { method:'POST', body: JSON.stringify(d) }),\n  modificaRicorrente: d => chiama('/spesa/ricorrenti', { method:'PATCH', body: JSON.stringify(d) }),\n  eliminaRicorrente: id => chiama('/spesa/ricorrenti?id=' + id, { method:'DELETE' }),\n\n  // pagamenti\n  creaPagamento   : d => chiama('/pagamenti', { method:'POST', body: JSON.stringify(d) }),\n  modificaPagamento: d => chiama('/pagamenti', { method:'PATCH', body: JSON.stringify(d) }),\n  eliminaPagamento: id => chiama('/pagamenti?id=' + id, { method:'DELETE' }),\n\n  // registro\n  registro        : (modulo, limite) => chiama(`/registro?${modulo ? 'modulo='+modulo+'&' : ''}limite=${limite||80}`)\n};\n\n// Le scritture non devono mai bloccare l'interfaccia: si tenta, e se fallisce\n// si continua in locale. L'utente vede subito il risultato.\nexport async function prova(promessa){\n  try { await promessa; return true; } catch { return false; }\n}\n", "/js/app.js": "// Avvio dell'applicazione: colonna dei moduli, schede della sezione,\n// ridisegno quando lo stato cambia. Nessun modulo tocca il DOM degli altri.\n\nimport { $, $$, esc, GG, MM, OGGI } from './util.js';\nimport { agganciaModale, agganciaModaleForm } from './ui.js';\nimport { MODULI, modulo } from './moduli/indice.js';\nimport * as S from './stato.js';\nimport { rete } from './api.js';\n\nconst vista = { modulo: 'home', sezione: 'oggi' };\nconst agganciati = new Set();\n\n/* ---------- colonna dei moduli ---------- */\n\nfunction disegnaColonna(){\n  $('#voci').innerHTML = MODULI.filter(m => !m.nascosto).map(m => {\n    const d = m.distintivo ? m.distintivo() : { n: 0 };\n    return `<li><button class=\"voce ${vista.modulo === m.id ? 'on' : ''}\" style=\"--c:${m.colore}\" data-modulo=\"${m.id}\">\n      <span class=\"emj\">${m.emoji}</span><span class=\"nm\">${esc(m.nome)}</span>\n      ${d.n ? `<span class=\"bdg ${d.caldo ? 'caldo' : ''}\">${d.n}</span>` : ''}\n    </button></li>`;\n  }).join('');\n\n  $('#stato-rete').innerHTML =\n    `<span class=\"punto\" style=\"background:${rete.collegata ? '#5FBF9E' : '#C58312'}\"></span>\n     ${rete.collegata ? 'collegata al database' : 'dati locali'}`;\n}\n\n/* ---------- testata e schede ---------- */\n\nfunction disegnaTestata(){\n  const m = modulo(vista.modulo);\n  const sez = m.sezioni.find(s => s.id === vista.sezione) || m.sezioni[0];\n\n  $('#occhiello').textContent = m.id === 'home' ? 'Panoramica' : m.nome;\n  $('#titolo').textContent = sez.nome === m.nome ? m.nome : sez.nome;\n  document.documentElement.style.setProperty('--accento', m.colore);\n\n  $('#schede').innerHTML = m.sezioni.length > 1\n    ? m.sezioni.map(s => `<button class=\"${s.id === vista.sezione ? 'on' : ''}\"\n        style=\"--c:${m.colore}\" data-sezione=\"${s.id}\">${esc(s.nome)}</button>`).join('')\n    : '';\n\n  $('#facce').innerHTML = (S.S.dati?.persone || []).filter(p => p.ruolo !== 'collaboratrice')\n    .map(p => `<span class=\"faccia\" style=\"background:${p.colore}\">${esc(p.iniziali)}</span>`).join('');\n\n  $('#data-oggi').innerHTML = `${GG[OGGI.getDay()]}<b>${OGGI.getDate()} ${MM[OGGI.getMonth()]}</b>`;\n}\n\n/* ---------- corpo ---------- */\n\nfunction disegna(){\n  if (!S.S.dati) return;\n  const m = modulo(vista.modulo);\n  if (!m.sezioni.some(s => s.id === vista.sezione)) vista.sezione = m.sezioni[0].id;\n\n  disegnaColonna();\n  disegnaTestata();\n\n  const corpo = $('#corpo');\n  corpo.innerHTML = `<div class=\"entra\">${m.render(vista.sezione, { vai })}</div>`;\n\n  // Ogni modulo si aggancia una sola volta, con delega sul contenitore.\n  if (!agganciati.has(m.id) && m.aggancia) {\n    m.aggancia(corpo, { vai, ridisegna: disegna });\n    m.ridisegna = disegna;\n    agganciati.add(m.id);\n  }\n}\n\nexport function vai(idModulo, idSezione){\n  vista.modulo = idModulo;\n  vista.sezione = idSezione || modulo(idModulo).sezioni[0].id;\n  $('#scorri').scrollTop = 0;\n  disegna();\n}\n\n/* ---------- eventi generali ---------- */\n\nfunction agganciaGuscio(){\n  $('#voci').addEventListener('click', e => {\n    const b = e.target.closest('[data-modulo]');\n    if (b) vai(b.dataset.modulo);\n  });\n\n  $('#schede').addEventListener('click', e => {\n    const b = e.target.closest('[data-sezione]');\n    if (b) vai(vista.modulo, b.dataset.sezione);\n  });\n\n  $('#vai-generali').addEventListener('click', () => vai('generali'));\n\n  $('#modo-pulizie').addEventListener('click', () => {\n    const app = $('#app');\n    const dentro = app.classList.toggle('concentrato');\n    $('#esci-modo').style.display = dentro ? '' : 'none';\n    if (dentro) vai('pulizie', 'checklist');\n  });\n\n  $('#esci-modo').addEventListener('click', () => {\n    $('#app').classList.remove('concentrato');\n    $('#esci-modo').style.display = 'none';\n  });\n\n  // Gli interruttori delle impostazioni sono dimostrativi finché\n  // non vengono collegati alla tabella impostazioni.\n  document.addEventListener('click', e => {\n    const sw = e.target.closest('.sw');\n    if (sw) sw.classList.toggle('on');\n    const sg = e.target.closest('.segmenti button');\n    if (sg && !sg.closest('#foglio-chi')) {\n      sg.parentElement.querySelectorAll('button').forEach(x => x.classList.remove('on'));\n      sg.classList.add('on');\n    }\n  });\n}\n\n/* ---------- avvio ---------- */\n\nasync function avvia(){\n  if (localStorage.getItem('ferrafoni.testoGrande') === '1') document.body.classList.add('testo-grande');\n  agganciaGuscio();\n  agganciaModale();\n  agganciaModaleForm();\n  S.iscriviti(disegna);\n  await S.carica();\n\n  // Ricontrollo periodico: fa comparire sull'iPad ciò che arriva dall'iPhone.\n  setInterval(() => { if (rete.collegata && !document.hidden) S.carica(S.S.settimana); }, 30000);\n  document.addEventListener('visibilitychange', () => { if (!document.hidden) S.carica(S.S.settimana); });\n}\n\navvia();\n", "/js/demo.js": "// Stessa forma della risposta di /api/stato.\n// Serve per lo sviluppo, per l'anteprima e come rete di sicurezza\n// se Cloudflare non risponde.\n\nimport { OGGI, piu, iso, lunedi } from './util.js';\n\nconst g = n => iso(piu(OGGI, n));\n\nconst VOCI = [\n  ['v01','pul_bagno','Bagno e sanitari','🚿','settimanale',7],\n  ['v02','pul_bagno','Specchi','🪞','settimanale',7],\n  ['v03','pul_bagno','Doccia e box','🧴','settimanale',7],\n  ['v04','pul_bagno','Cambio asciugamani','🧺','settimanale',7],\n  ['v05','pul_bagno','Tappetino bagno','🧽','settimanale',7],\n  ['v06','pul_cucina','Cucina e superfici','🍽️','settimanale',7],\n  ['v07','pul_cucina','Cambio strofinacci','🧻','settimanale',7],\n  ['v08','pul_cucina','Lavello e rubinetteria','🚰','settimanale',7],\n  ['v09','pul_cucina','Interno frigorifero','🧊','mensile',30],\n  ['v10','pul_cucina','Forno e piano cottura','🔥','mensile',30],\n  ['v11','pul_cucina','Filtri cappa','💨','trimestrale',90],\n  ['v12','pul_camere','Cambio lenzuola e federe','🛏️','quindicinale',14],\n  ['v13','pul_camere','Sotto i letti','🛌','quindicinale',14],\n  ['v14','pul_camere','Riordino giochi bambine','🧸','settimanale',7],\n  ['v15','pul_camere','Materassi, aspirare e girare','🪶','trimestrale',90],\n  ['v16','pul_giorno','Spolverare','✨','settimanale',7],\n  ['v17','pul_giorno','Sotto mobili e sedie','🪑','settimanale',7],\n  ['v18','pul_giorno','Aspirare e lavare i pavimenti','🧹','settimanale',7],\n  ['v19','pul_giorno','Battiscopa','📐','quindicinale',14],\n  ['v20','pul_giorno','Divano e cuscini','🛋️','quindicinale',14],\n  ['v21','pul_bianc','Cambio accappatoi','🥼','quindicinale',14],\n  ['v22','pul_bianc','Tovaglie e tovaglioli','🍽️','settimanale',7],\n  ['v23','pul_bianc','Bavaglini e grembiuli asilo','🎒','settimanale',7],\n  ['v24','pul_bianc','Pigiami bambine','👚','settimanale',7],\n  ['v25','pul_fondo','Vetri e finestre','🪟','mensile',30],\n  ['v26','pul_fondo','Termosifoni','♨️','mensile',30],\n  ['v27','pul_fondo','Porte e maniglie','🚪','mensile',30],\n  ['v28','pul_fondo','Tende doccia e sifoni','🧴','trimestrale',90],\n  ['v29','pul_fondo','Tende di casa','🪟','stagionale',120],\n  ['v30','pul_fondo','Cambio stagione armadi','👕','stagionale',180]\n];\n\nconst BIANC = [\n  ['b01','Strofinacci cucina',7,-5,'vivien',2,4],\n  ['b02','Asciugamani bagno',7,-8,'collab',6,4],\n  ['b03','Tappetino bagno',7,-6,'collab',3,2],\n  ['b04','Lenzuola matrimoniale',14,-13,'collab',3,2],\n  ['b05','Lenzuola lettino Amelie',14,-10,'vivien',4,2],\n  ['b06','Lenzuola lettino Maddie',14,-16,'vivien',4,2],\n  ['b07','Accappatoi',14,-9,'collab',4,2],\n  ['b08','Tovaglie',7,-4,'davide',5,2],\n  ['b09','Bavaglini asilo',7,-2,'vivien',8,4],\n  ['b10','Copriletto e plaid',30,-24,'collab',2,1]\n];\n\nconst SPESA = [\n  [1,'Pomodori da sugo','1 kg','sp_ortofrutta','tablet','vivien','da_prendere'],\n  [2,'Insalata','2 buste','sp_ortofrutta','tablet','vivien','da_prendere'],\n  [3,'Banane','1 casco','sp_ortofrutta','tablet','amelie','preso'],\n  [4,'Latte intero','2 L','sp_freschi','iphone','davide','da_prendere'],\n  [5,'Yogurt bambine','6','sp_freschi','tablet','vivien','da_prendere'],\n  [6,'Pannolini taglia 5','1 pacco','sp_bambine','iphone','vivien','da_prendere'],\n  [7,'Salviette','2','sp_bambine','tablet','vivien','da_prendere'],\n  [8,'Detersivo lavatrice','1','sp_casa','ricorrente',null,'da_prendere'],\n  [9,'Strofinacci nuovi','4','sp_casa','scorta',null,'da_prendere'],\n  [10,'Sacchi umido','1 rotolo','sp_casa','tablet','davide','preso']\n];\n\nconst ATT = [\n  ['a01','Manutenzione caldaia','att_manut','davide',-2,365],\n  ['a02','Bollo auto','att_doc','davide',1,365],\n  ['a03','Filtri condizionatore','att_manut','davide',4,180],\n  ['a04','Visita dentista','att_salute','vivien',12,180],\n  ['a05','Iscrizione asilo Maddie','att_bambine','vivien',19,365],\n  ['a06','Cambio gomme','att_auto','davide',26,180]\n];\n\nconst EVENTI = [\n  ['e01','Nuoto Amelie','famiglia',0,'17:00','amelie'],\n  ['e02','Riunione condominio','famiglia',1,'21:00','davide'],\n  ['e03','Festa asilo','asilo',2,'10:00','amelie'],\n  ['e04','Servizio pulizie','famiglia',3,'09:00','collab'],\n  ['e05','Pediatra Maddie','famiglia',3,'16:00','maddie'],\n  ['e06','Colloquio asilo','asilo',4,'17:00','vivien'],\n  ['e07','Cena dai nonni','famiglia',5,'20:00',null],\n  ['e08','Parco con le bambine','famiglia',6,'10:30',null]\n];\n\nexport function demo(settimana = iso(lunedi())){\n  const lun = new Date(settimana + 'T00:00:00');\n  return {\n    settimana,\n    aggiornato: new Date().toISOString(),\n    persone: [\n      { id:'davide', nome:'Davide', iniziali:'DA', ruolo:'adulto', colore:'#3D5BA9', tariffa_oraria:0 },\n      { id:'vivien', nome:'Vivien', iniziali:'VI', ruolo:'adulto', colore:'#2F7D6D', tariffa_oraria:0 },\n      { id:'amelie', nome:'Amelie', iniziali:'AM', ruolo:'bambina', colore:'#B9741F', tariffa_oraria:0 },\n      { id:'maddie', nome:'Maddie', iniziali:'MA', ruolo:'bambina', colore:'#9C3A5E', tariffa_oraria:0 },\n      { id:'collab', nome:'Lucia', iniziali:'LU', ruolo:'collaboratrice', colore:'#6E7A83', tariffa_oraria:12 }\n    ],\n    moduli: [\n      { id:'pulizie', nome:'Pulizie', colore:'#2F7D6D', ordine:1 },\n      { id:'calendario', nome:'Calendario', colore:'#3D5BA9', ordine:2 },\n      { id:'spesa', nome:'Lista della spesa', colore:'#B9741F', ordine:3 },\n      { id:'attivita', nome:'Attività programmate', colore:'#9C3A5E', ordine:4 }\n    ],\n    categorie: [\n      { id:'pul_bagno', modulo:'pulizie', nome:'Bagno', icona:'🚿', ordine:1 },\n      { id:'pul_cucina', modulo:'pulizie', nome:'Cucina', icona:'🍽️', ordine:2 },\n      { id:'pul_camere', modulo:'pulizie', nome:'Camere e letti', icona:'🛏️', ordine:3 },\n      { id:'pul_giorno', modulo:'pulizie', nome:'Zona giorno', icona:'🛋️', ordine:4 },\n      { id:'pul_bianc', modulo:'pulizie', nome:'Biancheria', icona:'🧺', ordine:5 },\n      { id:'pul_fondo', modulo:'pulizie', nome:'Pulizie di fondo', icona:'🪟', ordine:6 },\n      { id:'sp_ortofrutta', modulo:'spesa', nome:'Frutta e verdura', icona:'🥬', ordine:1 },\n      { id:'sp_freschi', modulo:'spesa', nome:'Banco freschi', icona:'🧀', ordine:2 },\n      { id:'sp_dispensa', modulo:'spesa', nome:'Dispensa', icona:'🥫', ordine:3 },\n      { id:'sp_bambine', modulo:'spesa', nome:'Bambine', icona:'🧸', ordine:4 },\n      { id:'sp_casa', modulo:'spesa', nome:'Casa e pulizia', icona:'🧼', ordine:6 },\n      { id:'att_manut', modulo:'attivita', nome:'Manutenzione', icona:'🔧', ordine:1 },\n      { id:'att_doc', modulo:'attivita', nome:'Documenti', icona:'📄', ordine:2 },\n      { id:'att_salute', modulo:'attivita', nome:'Salute', icona:'🩺', ordine:3 },\n      { id:'att_auto', modulo:'attivita', nome:'Auto', icona:'🚗', ordine:4 },\n      { id:'att_bambine', modulo:'attivita', nome:'Bambine', icona:'🧒', ordine:5 }\n    ],\n    impostazioni: [\n      { modulo:'generali', chiave:'nome_casa', valore:'Casa Ferrafoni' },\n      { modulo:'pulizie', chiave:'nome_collaboratrice', valore:'Collaboratrice' },\n      { modulo:'attivita', chiave:'giorni_avanti', valore:'7' }\n    ],\n    pulizie: {\n      voci: VOCI.map(([id, categoria_id, nome, icona, frequenza, ogni_giorni], i) =>\n        ({ id, categoria_id, nome, icona, frequenza, ogni_giorni, ordine: i })),\n      spunte: [\n        { voce_id:'v01', settimana, stato:'fatto', data:g(-1), persona_id:'collab' },\n        { voce_id:'v02', settimana, stato:'fatto', data:g(-1), persona_id:'collab' },\n        { voce_id:'v06', settimana, stato:'fatto', data:g(-1), persona_id:'collab' },\n        { voce_id:'v14', settimana, stato:'parziale', data:g(0), persona_id:'vivien' },\n        { voce_id:'v16', settimana, stato:'fatto', data:g(-1), persona_id:'collab' }\n      ],\n      ore: [\n        { id:1, persona_id:'collab', data:g(-8), ora_inizio:'09:00', ora_fine:'12:30', ore:3.5, tariffa_oraria:12 },\n        { id:2, persona_id:'collab', data:g(-4), ora_inizio:'09:00', ora_fine:'12:00', ore:3, tariffa_oraria:12 },\n        { id:3, persona_id:'collab', data:g(-1), ora_inizio:'09:00', ora_fine:'12:30', ore:3.5, tariffa_oraria:12 }\n      ]\n    },\n    biancheria: BIANC.map(([id, nome, ogni_giorni, ult, persona_id, scorta, scorta_minima], i) =>\n      ({ id, nome, ogni_giorni, ultimo_cambio:g(ult), persona_id, scorta, scorta_minima, ordine:i })),\n    spesa: {\n      articoli: SPESA.map(([id, nome, quantita, categoria_id, origine, persona_id, stato]) =>\n        ({ id, nome, quantita, categoria_id, origine, persona_id, stato, negozio:'supermercato' })),\n      ricorrenti: []\n    },\n    attivita: ATT.map(([id, nome, categoria_id, persona_id, giorni, ricorrenza_giorni]) =>\n      ({ id, nome, categoria_id, persona_id, scadenza:g(giorni), ricorrenza_giorni })),\n    eventi: EVENTI.map(([id, titolo, calendario, giorno, ora, persona_id]) =>\n      ({ id, titolo, calendario, inizio: iso(piu(lun, giorno)) + 'T' + ora, persona_id })),\n    registro: [\n      { modulo:'pulizie', azione:'fatto', dettaglio:'Bagno e sanitari', persona_id:'collab', persona_nome:'Lucia', creato_il: new Date(Date.now()-3600e3).toISOString() },\n      { modulo:'spesa', azione:'aggiunto', dettaglio:'Pannolini taglia 5', persona_id:'vivien', persona_nome:'Vivien', creato_il: new Date(Date.now()-7200e3).toISOString() },\n      { modulo:'pulizie', azione:'cambio biancheria', dettaglio:'b02', persona_id:'collab', persona_nome:'Lucia', creato_il: new Date(Date.now()-86000e3).toISOString() }\n    ],\n    pagamenti: [\n      { id:1, persona_id:'collab', data:g(-8), importo:40, nota:'Contanti, prima settimana' },\n      { id:2, persona_id:'collab', data:g(-1), importo:40, nota:'Bonifico' }\n    ]\n  };\n}\n", "/js/moduli/attivita.js": "// Modulo attività programmate: scadenze ricorrenti della casa,\n// raggruppate per categoria e con la data che si sposta da sola.\n\nimport { esc, gm, relativa, avviso, iso, OGGI } from '../util.js';\nimport { riq, tabella, rigaCfg, interruttore, barra, modaleForm } from '../ui.js';\nimport { api, prova } from '../api.js';\nimport * as S from '../stato.js';\n\nconst COLORE = 'var(--attivita)';\n\nfunction vistaScadenze(){\n  const lista = S.attivitaConScadenza();\n  const cats = S.categorie('attivita');\n\n  const righe = lista.map(a => `\n    <tr>\n      <td><b>${esc(a.nome)}</b><span class=\"sm\">${esc(S.categoria(a.categoria_id)?.nome || '')}</span></td>\n      <td>${esc(S.nomePersona(a.persona_id))}</td>\n      <td><span class=\"pill ${a.etichetta.classe}\">${esc(a.etichetta.testo)}</span>\n          <span class=\"sm\">${gm(a.quando)}</span></td>\n      <td>${a.ricorrenza_giorni ? 'ogni ' + (a.ricorrenza_giorni === 365 ? 'anno' :\n            a.ricorrenza_giorni === 180 ? '6 mesi' : a.ricorrenza_giorni + ' giorni') : 'una volta'}</td>\n      <td style=\"text-align:right\"><div class=\"riga-azioni\" style=\"justify-content:flex-end;display:inline-flex\">\n        <button class=\"btn piccolo\" style=\"background:var(--attivita)\" data-fatta=\"${a.id}\">Fatta</button>\n        <button data-mod-att=\"${a.id}\" title=\"Modifica\">✎</button>\n      </div></td>\n    </tr>`);\n\n  return `<div class=\"griglia g-lato\">\n    ${riq('Scadenze', tabella(['Attività','Chi','Scade','Ricorre',''], righe) +\n        `<div style=\"padding:14px 18px;border-top:1px solid var(--linea-tenue)\">\n           <button class=\"btn chiaro pieno\" data-nuova-attivita>Nuova attività</button></div>`,\n      { raso:true, classe:'tinta', colore:COLORE, meta:'in rosso quelle passate e di oggi' })}\n    <div class=\"griglia\" style=\"align-content:start\">\n      ${riq('Per categoria', cats.map(c => {\n        const n = lista.filter(a => a.categoria_id === c.id).length;\n        return `<div style=\"margin-bottom:14px\">\n          <div style=\"display:flex;justify-content:space-between;font-size:.87rem;margin-bottom:6px\">\n            <span>${c.icona} ${esc(c.nome)}</span><span style=\"color:var(--tenue)\">${n}</span></div>\n          ${barra(lista.length ? n / lista.length * 100 : 0, COLORE)}</div>`;\n      }).join(''))}\n      ${riq('Fatte di recente', `<ul class=\"righe\" style=\"margin:-16px -18px\">\n        ${lista.filter(a => a.ultima_esecuzione).slice(0,4).map(a =>\n          `<li><span class=\"tx\"><strong>${esc(a.nome)}</strong>\n           <span>${esc(S.nomePersona(a.persona_id))}</span></span>\n           <span class=\"qd\">${gm(a.ultima_esecuzione)}</span></li>`).join('')\n          || `<li><span class=\"tx\"><span>Ancora nessuna registrata</span></span></li>`}\n      </ul>`)}\n    </div>\n  </div>`;\n}\n\nfunction vistaImpostazioni(){\n  return `<div class=\"griglia g-lato\">\n    <div class=\"griglia\" style=\"align-content:start\">\n      ${riq('Categorie', `<div class=\"etichette\">\n        ${S.categorie('attivita').map(c => `<span class=\"et-i\">${c.icona} ${esc(c.nome)}</span>`).join('')}\n        <span class=\"et-i aggiungi\">Aggiungi categoria</span></div>`, { classe:'tinta', colore:COLORE })}\n      ${riq('Ricorrenze', `<ul class=\"cfg\" style=\"margin:-16px -18px\">\n        ${rigaCfg('Ricalcola dalla data di completamento','Se la fai con dieci giorni di ritardo, la prossima scadenza slitta di dieci giorni.', interruttore(true, COLORE))}\n        ${rigaCfg('Salta i giorni festivi','Sposta la scadenza al primo giorno feriale utile.', interruttore(false, COLORE))}\n        ${rigaCfg('Tieni lo storico per','', `<select><option>1 anno</option><option selected>3 anni</option><option>Sempre</option></select>`)}\n      </ul>`)}\n    </div>\n    <div class=\"griglia\" style=\"align-content:start\">\n      ${riq('Notifiche', `<ul class=\"cfg\" style=\"margin:-16px -18px\">\n        ${rigaCfg('Primo avviso','', `<select><option>3 giorni prima</option><option selected>7 giorni prima</option><option>14 giorni prima</option></select>`)}\n        ${rigaCfg('Secondo avviso','Il giorno stesso, alle 09:00.', interruttore(true, COLORE))}\n        ${rigaCfg('Insisti se è in ritardo','Un avviso al giorno finché non risulta fatta.', interruttore(true, COLORE))}\n      </ul>`)}\n      ${riq('Riquadro scadenze in home', `<ul class=\"cfg\" style=\"margin:-16px -18px\">\n        ${rigaCfg('Quanto guarda avanti','', `<select><option>3 giorni</option><option selected>7 giorni</option><option>14 giorni</option></select>`)}\n        ${rigaCfg('Segna in rosso','', `<select><option>Solo le scadute</option><option selected>Scadute e di oggi</option><option>Scadute, oggi e domani</option></select>`)}\n        ${rigaCfg('Includi i cambi biancheria','', interruttore(true, COLORE))}\n        ${rigaCfg('Includi le voci di pulizia','', interruttore(true, COLORE))}\n      </ul>`)}\n    </div>\n  </div>`;\n}\n\nexport default {\n  id: 'attivita',\n  nome: 'Attività programmate',\n  emoji: '🔔',\n  colore: COLORE,\n  sezioni: [{ id:'scadenze', nome:'Scadenze' }, { id:'impostazioni', nome:'Impostazioni' }],\n  distintivo(){\n    const n = S.attivitaConScadenza().filter(a => a.giorni <= 0).length;\n    return { n: n || S.attivitaConScadenza().length, caldo: n > 0 };\n  },\n  render(sezione){ return sezione === 'impostazioni' ? vistaImpostazioni() : vistaScadenze(); },\n  aggancia(root){\n    root.addEventListener('click', async e => {\n      const fatta = e.target.closest('[data-fatta]');\n      if (fatta) {\n        const a = S.S.dati.attivita.find(x => x.id === fatta.dataset.fatta);\n        if (!a) return;\n        a.ultima_esecuzione = iso(OGGI);\n        if (a.ricorrenza_giorni) {\n          const p = new Date(OGGI); p.setDate(p.getDate() + a.ricorrenza_giorni);\n          a.scadenza = iso(p);\n        }\n        S.aggiungiRegistroLocale('attivita', 'fatto', a.nome, a.persona_id);\n        prova(api.attivitaFatta(a.id));\n        S.avvisa();\n        avviso(a.nome + ': prossima scadenza ' + (a.scadenza ? relativa(a.scadenza) : 'nessuna'));\n        return;\n      }\n\n      const opzCat = S.categorie('attivita').map(c => ({ id:c.id, nome:c.nome }));\n      const opzPersone = [{ id:'', nome:'Nessuno in particolare' }, ...S.S.dati.persone.map(p => ({ id:p.id, nome:p.nome }))];\n      const opzRic = [\n        { id:'', nome:'Una volta sola' }, { id:'30', nome:'Ogni mese' }, { id:'90', nome:'Ogni 3 mesi' },\n        { id:'180', nome:'Ogni 6 mesi' }, { id:'365', nome:'Ogni anno' }\n      ];\n\n      if (e.target.closest('[data-nuova-attivita]')) {\n        const r = await modaleForm({\n          titolo: 'Nuova attività', colore: COLORE,\n          valori: { scadenza: iso(OGGI) },\n          campi: [\n            { nome:'nome', etichetta:'Che cosa', richiesto:true, placeholder:'Es. Revisione auto' },\n            { nome:'categoria_id', etichetta:'Categoria', tipo:'select', opzioni: opzCat, richiesto:true },\n            { nome:'persona_id', etichetta:'Chi se ne occupa', tipo:'select', opzioni: opzPersone },\n            { nome:'scadenza', etichetta:'Scade il', tipo:'data', richiesto:true },\n            { nome:'ricorrenza_giorni', etichetta:'Si ripete', tipo:'select', opzioni: opzRic }\n          ]\n        });\n        if (r?.azione === 'salva' && r.valori.nome && r.valori.scadenza) {\n          const v = { ...r.valori, ricorrenza_giorni: r.valori.ricorrenza_giorni ? Number(r.valori.ricorrenza_giorni) : null };\n          S.aggiungiAttivitaLocale({ id:'loc'+Date.now(), ...v });\n          prova(api.creaAttivita(v));\n          avviso('Attività aggiunta');\n        }\n        return;\n      }\n\n      const mod = e.target.closest('[data-mod-att]');\n      if (mod) {\n        const a = S.S.dati.attivita.find(x => x.id === mod.dataset.modAtt);\n        const r = await modaleForm({\n          titolo: a.nome, colore: COLORE, permettiElimina: true,\n          valori: { nome:a.nome, categoria_id:a.categoria_id, persona_id:a.persona_id || '',\n                    scadenza:a.scadenza, ricorrenza_giorni: a.ricorrenza_giorni ? String(a.ricorrenza_giorni) : '' },\n          campi: [\n            { nome:'nome', etichetta:'Che cosa', richiesto:true },\n            { nome:'categoria_id', etichetta:'Categoria', tipo:'select', opzioni: opzCat },\n            { nome:'persona_id', etichetta:'Chi se ne occupa', tipo:'select', opzioni: opzPersone },\n            { nome:'scadenza', etichetta:'Scade il', tipo:'data' },\n            { nome:'ricorrenza_giorni', etichetta:'Si ripete', tipo:'select', opzioni: opzRic }\n          ]\n        });\n        if (r?.azione === 'salva') {\n          const v = { ...r.valori, ricorrenza_giorni: r.valori.ricorrenza_giorni ? Number(r.valori.ricorrenza_giorni) : null };\n          S.modificaAttivitaLocale(a.id, v);\n          prova(api.modificaAttivita({ id: a.id, ...v }));\n          avviso('Attività aggiornata');\n        } else if (r?.azione === 'elimina') {\n          S.rimuoviAttivitaLocale(a.id);\n          prova(api.eliminaAttivita(a.id));\n          avviso('Attività eliminata');\n        }\n      }\n    });\n  }\n};\n", "/js/moduli/calendario.js": "// Modulo calendario: settimana a sette colonne, con dentro anche\n// i turni delle pulizie e i cambi biancheria se attivati.\n\nimport { esc, GG3, piu, iso, lunedi, OGGI, breve, avviso } from '../util.js';\nimport { riq, rigaCfg, interruttore, modaleForm } from '../ui.js';\nimport { api, prova } from '../api.js';\nimport * as S from '../stato.js';\n\nconst COLORE = 'var(--calendario)';\nconst TINTE = { famiglia:'var(--calendario)', asilo:'var(--spesa)', lavoro:'var(--attivita)' };\n\nfunction settimana(){\n  const lun = lunedi();\n  const colonne = [];\n\n  for (let i = 0; i < 7; i++) {\n    const g = piu(lun, i);\n    const oggi = iso(g) === iso(OGGI);\n    const eventi = S.eventiDelGiorno(g);\n    const bianc = S.biancheriaConScadenza().filter(b => iso(b.prossimo) === iso(g));\n    const att = S.attivitaConScadenza().filter(a => iso(a.quando) === iso(g));\n\n    colonne.push(`\n      <div class=\"giorno ${oggi ? 'oggi' : ''}\">\n        <h4>${GG3[g.getDay()]}<b>${g.getDate()}</b></h4>\n        ${eventi.map(e => card(e.titolo, e.inizio.slice(11,16), TINTE[e.calendario] || COLORE)).join('')}\n        ${bianc.map(b => card('Cambio ' + b.nome.toLowerCase(), 'biancheria', 'var(--pulizie)')).join('')}\n        ${att.map(a => card(a.nome, 'scadenza', 'var(--attivita)')).join('')}\n      </div>`);\n  }\n\n  return `<div class=\"sett\">${colonne.join('')}</div>`;\n}\n\nconst card = (titolo, sotto, colore) => `\n  <div class=\"ev\" style=\"--ec:${colore}\"><b>${esc(titolo)}</b><span>${esc(sotto)}</span></div>`;\n\nfunction vistaSettimana(){\n  const lun = lunedi();\n  const prossimi = (S.S.dati.eventi || [])\n    .filter(e => e.inizio.slice(0,10) >= iso(OGGI)).slice(0, 6);\n\n  return riq(breve(lun) + ' – ' + breve(piu(lun, 6)), settimana(),\n    { raso: true, classe: 'tinta', colore: COLORE, meta: 'settimana in corso' }) +\n    `<div class=\"griglia g2\" style=\"margin-top:18px\">\n      ${riq('Prossimi impegni', `<ul class=\"righe\" style=\"margin:-16px -18px\">\n        ${prossimi.map(e => `<li><span class=\"tx\"><strong>${esc(e.titolo)}</strong>\n          <span>${esc(S.nomePersona(e.persona_id) || e.calendario)}</span></span>\n          <span class=\"qd\">${esc(new Date(e.inizio).toLocaleDateString('it-IT',{weekday:'short',day:'numeric'}))}\n          ${esc(e.inizio.slice(11,16))}</span></li>`).join('')}\n      </ul>` + `<div style=\"padding:14px 18px;border-top:1px solid var(--linea-tenue)\">\n        <button class=\"btn chiaro pieno\" data-nuovo-evento>Nuovo impegno</button></div>`)}\n      ${riq('Calendari collegati', `<ul class=\"righe\" style=\"margin:-16px -18px\">\n        ${['famiglia','asilo','lavoro'].map(c => `<li>\n          <span class=\"pill\" style=\"--c:${TINTE[c]}\">${esc(c)}</span>\n          <span class=\"tx\"><strong>${c === 'famiglia' ? 'Casa Ferrafoni' : c === 'asilo' ? 'Amelie e Maddie' : 'Davide'}</strong>\n          <span>${(S.S.dati.eventi || []).filter(e => e.calendario === c).length} impegni</span></span></li>`).join('')}\n      </ul>`)}\n    </div>`;\n}\n\nfunction vistaImpostazioni(){\n  return `<div class=\"griglia g-lato\">\n    <div class=\"griglia\" style=\"align-content:start\">\n      ${riq('Calendari', `<ul class=\"cfg\" style=\"margin:-16px -18px\">\n        ${rigaCfg('Casa Ferrafoni', 'Visibile a tutti, modificabile da Davide e Vivien.', interruttore(true, COLORE))}\n        ${rigaCfg('Asilo di Amelie e Maddie', 'Sola lettura, si aggiorna ogni notte.', interruttore(true, COLORE))}\n        ${rigaCfg('Lavoro di Davide', 'Mostra le fasce occupate senza i titoli.', interruttore(true, COLORE))}\n        ${rigaCfg('Festività italiane', 'Giorni rossi e chiusure dell\\'asilo.', interruttore(false, COLORE))}\n      </ul>`, { classe: 'tinta', colore: COLORE })}\n      ${riq('Cosa appare nella griglia', `<ul class=\"cfg\" style=\"margin:-16px -18px\">\n        ${rigaCfg('Checklist pulizie', '', interruttore(true, COLORE))}\n        ${rigaCfg('Cambi biancheria', '', interruttore(true, COLORE))}\n        ${rigaCfg('Attività programmate', '', interruttore(true, COLORE))}\n        ${rigaCfg('Giorni di spesa', '', interruttore(false, COLORE))}\n      </ul>`)}\n    </div>\n    ${riq('Avvisi', `<ul class=\"cfg\" style=\"margin:-16px -18px\">\n      ${rigaCfg('Avvisa prima di ogni impegno', '', `<select><option>10 minuti</option><option selected>30 minuti</option><option>1 ora</option></select>`)}\n      ${rigaCfg('Vista predefinita', '', `<div class=\"segmenti\"><button>Giorno</button><button class=\"on\">Settimana</button><button>Mese</button></div>`)}\n      ${rigaCfg('Riepilogo della sera', 'Alle 21:00, cosa succede domani.', interruttore(true, COLORE))}\n      ${rigaCfg('Silenzia di notte', 'Dalle 21:30 alle 07:00.', interruttore(true, COLORE))}\n    </ul>`)}\n  </div>`;\n}\n\nexport default {\n  id: 'calendario',\n  nome: 'Calendario',\n  emoji: '📅',\n  colore: COLORE,\n  sezioni: [{ id:'settimana', nome:'Settimana' }, { id:'impostazioni', nome:'Impostazioni' }],\n  distintivo(){ return { n: S.eventiDelGiorno().length, caldo: false }; },\n  render(sezione){ return sezione === 'impostazioni' ? vistaImpostazioni() : vistaSettimana(); },\n  aggancia(root){\n    root.addEventListener('click', async e => {\n      if (!e.target.closest('[data-nuovo-evento]')) return;\n\n      const opzCal = [{ id:'famiglia', nome:'Famiglia' }, { id:'asilo', nome:'Asilo' }, { id:'lavoro', nome:'Lavoro' }];\n      const opzPersone = [{ id:'', nome:'Tutta la famiglia' }, ...S.S.dati.persone.map(p => ({ id:p.id, nome:p.nome }))];\n\n      const r = await modaleForm({\n        titolo: 'Nuovo impegno', colore: COLORE,\n        valori: { data: iso(OGGI), ora:'09:00' },\n        campi: [\n          { nome:'titolo', etichetta:'Che cosa', richiesto:true, placeholder:'Es. Visita dal pediatra' },\n          { nome:'calendario', etichetta:'Calendario', tipo:'select', opzioni: opzCal },\n          { nome:'persona_id', etichetta:'Per chi', tipo:'select', opzioni: opzPersone },\n          { nome:'data', etichetta:'Giorno', tipo:'data', richiesto:true },\n          { nome:'ora', etichetta:'Ora (es. 16:00)' },\n          { nome:'luogo', etichetta:'Luogo', placeholder:'Facoltativo' }\n        ]\n      });\n      if (r?.azione === 'salva' && r.valori.titolo && r.valori.data) {\n        const inizio = r.valori.data + 'T' + (r.valori.ora || '09:00');\n        const evento = { id:'loc'+Date.now(), titolo:r.valori.titolo, calendario:r.valori.calendario,\n                          persona_id:r.valori.persona_id || null, luogo:r.valori.luogo || null, inizio };\n        S.aggiungiEventoLocale(evento);\n        prova(api.creaEvento({ ...evento }));\n        avviso('Impegno aggiunto');\n      }\n    });\n  }\n};\n", "/js/moduli/generali.js": "// Impostazioni della casa: persone, dispositivo, dati e aspetto.\n\nimport { esc, avviso } from '../util.js';\nimport { riq, rigaCfg, interruttore, modaleForm } from '../ui.js';\nimport { chiave, salvaChiave, rete, api, prova } from '../api.js';\nimport * as S from '../stato.js';\n\nconst COLORE = 'var(--home)';\nconst MODULI_CAT = [\n  { id:'pulizie', nome:'Pulizie', colore:'var(--pulizie)' },\n  { id:'spesa', nome:'Lista della spesa', colore:'var(--spesa)' },\n  { id:'attivita', nome:'Attività programmate', colore:'var(--attivita)' },\n  { id:'calendario', nome:'Calendario', colore:'var(--calendario)' }\n];\n\nexport default {\n  id: 'generali',\n  nome: 'Casa e famiglia',\n  emoji: '⚙️',\n  colore: COLORE,\n  nascosto: true,\n  sezioni: [{ id:'casa', nome:'Casa e famiglia' }],\n  distintivo(){ return { n: 0, caldo: false }; },\n\n  render(){\n    return `<div class=\"griglia g-lato\">\n      <div class=\"griglia\" style=\"align-content:start\">\n        ${riq('Chi vive in casa', `<ul class=\"cfg\" style=\"margin:-16px -18px\">\n          ${S.S.dati.persone.map(p => `<li>\n            <span class=\"tx\"><strong>${esc(p.nome)}</strong><span>${\n              p.ruolo === 'collaboratrice' ? 'Vede solo checklist pulizie e ore lavorate' :\n              p.ruolo === 'bambina' ? 'Compare nelle attività, non accede all\\'app' : 'Accesso completo'}</span></span>\n            <button class=\"btn chiaro piccolo\" data-mod-persona=\"${p.id}\">Modifica</button>\n          </li>`).join('')}\n        </ul>\n        <div style=\"padding:14px 18px;border-top:1px solid var(--linea-tenue)\">\n          <button class=\"btn chiaro pieno\" data-nuova-persona>Aggiungi persona</button>\n        </div>`, { classe:'tinta', colore:COLORE })}\n\n        ${riq('Categorie per modulo', MODULI_CAT.map(m => `\n          <div class=\"gruppo aperto\">\n            <button class=\"capo\" data-gruppo=\"gc_${m.id}\">\n              <b>${esc(m.nome)}</b>\n              <span class=\"avanz\">${S.categorie(m.id).length} categorie</span>\n              <span class=\"freccia\"></span></button>\n            <div class=\"elenco\"><div>\n              <div style=\"padding:12px 18px\">\n                <div class=\"etichette\">\n                  ${S.categorie(m.id).map(c => `<button class=\"et-i\" data-mod-cat=\"${c.id}\">${c.icona || '📁'} ${esc(c.nome)}</button>`).join('')}\n                  <button class=\"et-i aggiungi\" data-nuova-cat=\"${m.id}\">Aggiungi categoria</button>\n                </div>\n              </div>\n            </div></div>\n          </div>`).join(''), { raso:true })}\n        ${riq('Dispositivo di casa', `<ul class=\"cfg\" style=\"margin:-16px -18px\">\n          ${rigaCfg('Schermo sempre acceso','L\\'iPad resta sulla home quando è in carica.', interruttore(true, COLORE))}\n          ${rigaCfg('Torna alla home dopo','', `<select><option>2 minuti</option><option selected>5 minuti</option><option>Mai</option></select>`)}\n          ${rigaCfg('Testo grande','Aumenta i caratteri su tutta l\\'app.', interruttore(document.body.classList.contains('testo-grande'), COLORE, 'data-testo-grande'))}\n        </ul>`)}\n      </div>\n      <div class=\"griglia\" style=\"align-content:start\">\n        ${riq('Dati e collegamento', `<ul class=\"cfg\" style=\"margin:-16px -18px\">\n          ${rigaCfg('Stato', rete.collegata ? 'Collegata al database su Cloudflare.' : 'Sta usando i dati locali di prova.',\n            `<span class=\"pill ${rete.collegata ? 'verde' : 'ambra'}\">${rete.collegata ? 'Collegata' : 'Locale'}</span>`)}\n          ${rigaCfg('Chiave di casa','La stessa che usi nel comando rapido dell\\'iPhone.',\n            `<input type=\"password\" id=\"chiave-generale\" value=\"${esc(chiave())}\" style=\"min-width:180px\">`)}\n          ${rigaCfg('','', `<button class=\"btn piccolo\" style=\"background:var(--home)\" data-salva-chiave-gen>Salva e ricarica</button>`)}\n          ${rigaCfg('Ricarica automatica','L\\'app rilegge il database ogni 30 secondi.', interruttore(true, COLORE))}\n        </ul>`)}\n        ${riq('Moduli attivi', `<ul class=\"cfg\" style=\"margin:-16px -18px\">\n          ${S.S.dati.moduli.map(m => rigaCfg(m.nome, '', interruttore(true, m.colore))).join('')}\n        </ul>\n        <p class=\"nota\">Per aggiungere un modulo nuovo basta una riga nella tabella moduli e un file in public/js/moduli.</p>`)}\n      </div>\n    </div>`;\n  },\n\n  aggancia(root){\n    root.addEventListener('click', async e => {\n      if (e.target.closest('[data-testo-grande]')) {\n        document.body.classList.toggle('testo-grande');\n        localStorage.setItem('ferrafoni.testoGrande', document.body.classList.contains('testo-grande') ? '1' : '0');\n        return;\n      }\n      if (e.target.closest('[data-salva-chiave-gen]')) {\n        salvaChiave(root.querySelector('#chiave-generale').value.trim());\n        S.carica();\n        return;\n      }\n      const g = e.target.closest('[data-gruppo]');\n      if (g) { g.closest('.gruppo').classList.toggle('aperto'); return; }\n\n      const opzRuoli = [\n        { id:'adulto', nome:'Adulto' }, { id:'bambina', nome:'Bambina' }, { id:'collaboratrice', nome:'Chi pulisce' }\n      ];\n\n      if (e.target.closest('[data-nuova-persona]')) {\n        const r = await modaleForm({\n          titolo: 'Nuova persona', colore: COLORE,\n          campi: [\n            { nome:'nome', etichetta:'Nome', richiesto:true },\n            { nome:'iniziali', etichetta:'Iniziali (due lettere)', placeholder:'Es. GF' },\n            { nome:'ruolo', etichetta:'Ruolo', tipo:'select', opzioni: opzRuoli },\n            { nome:'colore', etichetta:'Colore (esadecimale)', placeholder:'#6E7A83', difetto:'#6E7A83' }\n          ]\n        });\n        if (r?.azione === 'salva' && r.valori.nome) {\n          const p = { id:'loc'+Date.now(), ...r.valori };\n          S.aggiungiPersonaLocale(p);\n          prova(api.creaPersona(r.valori));\n          avviso('Persona aggiunta');\n          this.ridisegna();\n        }\n        return;\n      }\n\n      const modP = e.target.closest('[data-mod-persona]');\n      if (modP) {\n        const p = S.persona(modP.dataset.modPersona);\n        const r = await modaleForm({\n          titolo: p.nome, colore: COLORE,\n          valori: { nome:p.nome, iniziali:p.iniziali, ruolo:p.ruolo, colore:p.colore },\n          campi: [\n            { nome:'nome', etichetta:'Nome', richiesto:true },\n            { nome:'iniziali', etichetta:'Iniziali' },\n            { nome:'ruolo', etichetta:'Ruolo', tipo:'select', opzioni: opzRuoli },\n            { nome:'colore', etichetta:'Colore (esadecimale)' }\n          ]\n        });\n        if (r?.azione === 'salva') {\n          S.modificaPersonaLocale(p.id, r.valori);\n          prova(api.modificaPersona({ id: p.id, ...r.valori }));\n          avviso('Persona aggiornata');\n          this.ridisegna();\n        }\n        return;\n      }\n\n      const nuovaCat = e.target.closest('[data-nuova-cat]');\n      if (nuovaCat) {\n        const modulo = nuovaCat.dataset.nuovaCat;\n        const r = await modaleForm({\n          titolo: 'Nuova categoria', colore: COLORE,\n          campi: [\n            { nome:'nome', etichetta:'Nome della categoria', richiesto:true },\n            { nome:'icona', etichetta:'Icona (una emoji)', placeholder:'📁', difetto:'📁' }\n          ]\n        });\n        if (r?.azione === 'salva' && r.valori.nome) {\n          const c = { id:'loc'+Date.now(), modulo, ...r.valori };\n          S.aggiungiCategoriaLocale(c);\n          prova(api.creaCategoria({ modulo, ...r.valori }));\n          avviso('Categoria aggiunta');\n          this.ridisegna();\n        }\n        return;\n      }\n\n      const modCat = e.target.closest('[data-mod-cat]');\n      if (modCat) {\n        const c = S.categoria(modCat.dataset.modCat);\n        const r = await modaleForm({\n          titolo: c.nome, colore: COLORE, permettiElimina: true,\n          valori: { nome:c.nome, icona:c.icona },\n          campi: [\n            { nome:'nome', etichetta:'Nome', richiesto:true },\n            { nome:'icona', etichetta:'Icona' }\n          ]\n        });\n        if (r?.azione === 'salva') {\n          S.modificaCategoriaLocale(c.id, r.valori);\n          prova(api.modificaCategoria({ id: c.id, ...r.valori }));\n          avviso('Categoria aggiornata');\n        } else if (r?.azione === 'elimina') {\n          S.rimuoviCategoriaLocale(c.id);\n          prova(api.eliminaCategoria(c.id));\n          avviso('Categoria tolta');\n        }\n        this.ridisegna();\n      }\n    });\n  }\n};\n", "/js/moduli/home.js": "// La home non è un elenco: è un riquadro di urgenze più quattro tessere\n// che si aprono a cascata, una alla volta, senza far scorrere la pagina.\n\nimport { esc, gm, relativa, plurale, OGGI, GG, MM } from '../util.js';\nimport { pill, anello, vuoto } from '../ui.js';\nimport * as S from '../stato.js';\n\nconst APERTA = { id: null };\n\nfunction tessera({ id, nome, colore, emoji, cifra, sotto, percento, righe, azione }){\n  const aperta = APERTA.id === id;\n  return `\n  <article class=\"tessera ${aperta ? 'aperta' : ''}\" style=\"--c:${colore}\" data-tessera=\"${id}\">\n    <button class=\"testa\" data-apri=\"${id}\">\n      <span class=\"emj\">${emoji}</span>\n      <span class=\"info\"><b>${esc(nome)}</b><span>${esc(sotto)}</span></span>\n      ${percento !== undefined\n        ? `<span style=\"position:relative;display:flex;align-items:center;justify-content:center\">\n             ${anello(percento, colore, 58)}\n             <b style=\"position:absolute;font-size:.82rem;color:${colore}\">${percento}%</b>\n           </span>`\n        : `<span class=\"cifra\">${cifra}</span>`}\n      <span class=\"freccia\"></span>\n    </button>\n    <div class=\"corpo\"><div>\n      <ul class=\"righe\">${righe || ''}</ul>\n      <div class=\"piedino\">\n        <span class=\"occhiello\">${esc(azione.nota || '')}</span>\n        <button class=\"btn piccolo\" style=\"background:${colore}\" data-vai=\"${azione.vai}\">${esc(azione.testo)}</button>\n      </div>\n    </div></div>\n  </article>`;\n}\n\nconst rigaSemplice = (titolo, sotto, destra, urgente) => `\n  <li class=\"${urgente ? 'urgente' : ''}\">\n    <span class=\"tx\"><strong>${esc(titolo)}</strong>${sotto ? `<span>${esc(sotto)}</span>` : ''}</span>\n    <span class=\"qd\">${esc(destra || '')}</span></li>`;\n\nfunction urgenze(){\n  const lista = S.scadenzeSettimana(Number(S.impostazione('attivita', 'giorni_avanti', 7)));\n  const gravi = lista.filter(x => x.etichetta.urgente);\n\n  if (!lista.length) return `<div class=\"urgenze vuota\">\n    <div class=\"urg calma\"><span class=\"emj\">✅</span><span><b>Niente in scadenza</b>\n    <span>Nella settimana non c'è nulla da recuperare</span></span></div></div>`;\n\n  const mostrate = (gravi.length ? gravi : lista).slice(0, 4);\n  return `<div class=\"urgenze\">${mostrate.map(x => `\n    <button class=\"urg ${x.etichetta.urgente ? '' : 'calma'}\" data-vai=\"${x.modulo}:${x.sezione}\">\n      <span class=\"emj\">${x.emoji}</span>\n      <span><b>${esc(x.titolo)}</b><span>${esc(x.sotto)} · ${esc(x.etichetta.testo)}</span></span>\n    </button>`).join('')}</div>`;\n}\n\nexport default {\n  id: 'home',\n  nome: 'Oggi',\n  emoji: '🏠',\n  colore: 'var(--home)',\n  sezioni: [{ id: 'oggi', nome: 'Oggi' }],\n\n  distintivo(){\n    const n = S.urgenti().length;\n    return { n, caldo: n > 0 };\n  },\n\n  render(){\n    const av = S.avanzamentoPulizie();\n    const bianc = S.biancheriaConScadenza();\n    const spesa = S.spesaDaPrendere();\n    const att = S.attivitaConScadenza();\n    const eventi = S.eventiDelGiorno();\n\n    const tessere = [\n      tessera({\n        id: 'pulizie', nome: 'Pulizie', colore: 'var(--pulizie)', emoji: '🧽',\n        percento: av.percento,\n        sotto: plurale(av.restanti, 'voce ancora da fare', 'voci ancora da fare'),\n        righe: S.S.dati.pulizie.voci.filter(v => !S.spunta(v.id)).slice(0, 5)\n          .map(v => rigaSemplice(v.nome, S.categoria(v.categoria_id)?.nome, v.frequenza)).join('')\n          || `<li><span class=\"tx\"><strong>Tutto fatto per questa settimana</strong></span></li>`,\n        azione: { testo: 'Apri la checklist', vai: 'pulizie:checklist',\n                  nota: av.parziali ? plurale(av.parziali, 'voce parziale', 'voci parziali') : '' }\n      }),\n      tessera({\n        id: 'spesa', nome: 'Lista della spesa', colore: 'var(--spesa)', emoji: '🛒',\n        cifra: spesa.length, sotto: 'articoli da prendere',\n        righe: spesa.slice(0, 5).map(a => rigaSemplice(\n          a.nome, a.origine === 'iphone' ? 'aggiunto dall\\'iPhone' : S.categoria(a.categoria_id)?.nome,\n          a.quantita)).join('') || vuoto('La lista è vuota'),\n        azione: { testo: 'Apri la lista', vai: 'spesa:lista',\n                  nota: spesa.filter(a => a.origine === 'iphone').length\n                        ? 'Qualcosa è arrivato dall\\'iPhone' : '' }\n      }),\n      tessera({\n        id: 'biancheria', nome: 'Biancheria', colore: 'var(--pulizie)', emoji: '🧺',\n        cifra: bianc.filter(b => b.giorni <= 0).length, sotto: 'cambi da fare adesso',\n        righe: bianc.slice(0, 5).map(b => rigaSemplice(\n          b.nome, 'ultimo cambio ' + gm(b.ultimo_cambio), b.etichetta.testo, b.etichetta.urgente)).join(''),\n        azione: { testo: 'Registra un cambio', vai: 'pulizie:biancheria', nota: '' }\n      }),\n      tessera({\n        id: 'giornata', nome: 'La giornata', colore: 'var(--calendario)', emoji: '📅',\n        cifra: eventi.length + att.filter(a => a.giorni === 0).length, sotto: 'tra impegni e scadenze',\n        righe: (eventi.map(e => rigaSemplice(e.titolo, S.nomePersona(e.persona_id), e.inizio.slice(11, 16)))\n          .concat(att.filter(a => a.giorni <= 1).map(a => rigaSemplice(\n            a.nome, S.categoria(a.categoria_id)?.nome, relativa(a.quando), a.giorni <= 0))))\n          .slice(0, 5).join('') || vuoto('Giornata libera'),\n        azione: { testo: 'Apri il calendario', vai: 'calendario:settimana', nota: '' }\n      })\n    ];\n\n    return `\n      <p class=\"occhiello\" style=\"margin:0 0 12px\">\n        ${GG[OGGI.getDay()]} ${OGGI.getDate()} ${MM[OGGI.getMonth()]} · ${esc(S.impostazione('generali','nome_casa','Casa Ferrafoni'))}\n      </p>\n      ${urgenze()}\n      <div class=\"cascata\">${tessere.join('')}</div>`;\n  },\n\n  aggancia(root, { vai }){\n    root.addEventListener('click', e => {\n      const apri = e.target.closest('[data-apri]');\n      if (apri) { APERTA.id = APERTA.id === apri.dataset.apri ? null : apri.dataset.apri; this.ridisegna(); return; }\n      const dest = e.target.closest('[data-vai]');\n      if (dest) { const [m, s] = dest.dataset.vai.split(':'); vai(m, s); }\n    });\n  }\n};\n", "/js/moduli/indice.js": "// Registro dei moduli. Aggiungerne uno nuovo domani significa\n// creare il file, importarlo qui e aggiungerlo all'elenco. Nient'altro.\n\nimport home from './home.js';\nimport pulizie from './pulizie.js';\nimport calendario from './calendario.js';\nimport spesa from './spesa.js';\nimport attivita from './attivita.js';\nimport registro from './registro.js';\nimport generali from './generali.js';\n\nexport const MODULI = [home, pulizie, calendario, spesa, attivita, registro, generali];\nexport const modulo = id => MODULI.find(m => m.id === id) || MODULI[0];\n", "/js/moduli/pulizie.js": "// Modulo pulizie. La checklist è divisa per zona: si apre una zona alla volta,\n// così su tablet non si scorre mai un elenco di trenta righe.\n\nimport { esc, gm, breve, iso, piu, lunedi, OGGI, scarto, plurale, avviso } from '../util.js';\nimport { riq, tabella, anello, barra, interruttore, rigaCfg, vuoto } from '../ui.js';\nimport { modaleData, modaleForm } from '../ui.js';\nimport { api, prova } from '../api.js';\nimport * as S from '../stato.js';\n\nconst COLORE = 'var(--pulizie)';\nconst FREQ = {\n  giornaliera: 'ogni giorno', settimanale: 'ogni settimana', quindicinale: 'ogni 2 settimane',\n  mensile: 'ogni mese', trimestrale: 'ogni 3 mesi', stagionale: 'a ogni cambio stagione'\n};\n\nconst aperti = new Set();\nlet primaVolta = true;\n\n/* ---------- checklist ---------- */\n\nfunction gruppo(cat, voci){\n  const fatte = voci.filter(v => S.spunta(v.id)?.stato === 'fatto').length;\n  const aperto = aperti.has(cat.id);\n  const tutte = fatte === voci.length;\n\n  return `\n  <div class=\"gruppo ${aperto ? 'aperto' : ''}\">\n    <button class=\"capo\" data-gruppo=\"${cat.id}\">\n      <span class=\"emj\">${cat.icona || '•'}</span>\n      <b>${esc(cat.nome)}</b>\n      <span class=\"avanz\">${fatte} di ${voci.length}${tutte ? ' · completata' : ''}</span>\n      <span style=\"width:78px\">${barra(voci.length ? fatte / voci.length * 100 : 0, COLORE)}</span>\n      <span class=\"freccia\"></span>\n    </button>\n    <div class=\"elenco\"><div>${voci.map(compito).join('')}</div></div>\n  </div>`;\n}\n\nfunction compito(v){\n  const s = S.spunta(v.id);\n  const stato = s?.stato;\n  const scaduto = !stato && v.frequenza === 'settimanale' && scarto(piu(new Date(S.S.settimana + 'T00:00:00'), 6)) < 0;\n\n  const timbro = s\n    ? `<b>${gm(s.data)}</b>${esc(S.nomePersona(s.persona_id))}`\n    : `<span style=\"color:var(--tenue-chiaro)\">nessuna data</span>`;\n\n  return `\n  <div class=\"compito ${stato === 'fatto' ? 'fatto' : ''} ${scaduto ? 'scaduto' : ''}\">\n    <span class=\"emj\">${v.icona || '•'}</span>\n    <span class=\"tx\"><strong>${esc(v.nome)}</strong><span>${FREQ[v.frequenza] || v.frequenza}</span></span>\n    <button class=\"quando\" data-data=\"${v.id}\">${timbro}</button>\n    <span class=\"segna\">\n      <button data-segna=\"fatto\" data-voce=\"${v.id}\" class=\"${stato === 'fatto' ? 'f-on' : ''}\">Fatto</button>\n      <button data-segna=\"parziale\" data-voce=\"${v.id}\" class=\"${stato === 'parziale' ? 'p-on' : ''}\">Parziale</button>\n    </span>\n  </div>`;\n}\n\nfunction barraSettimana(){\n  const lun = new Date(S.S.settimana + 'T00:00:00');\n  const av = S.avanzamentoPulizie();\n  const corrente = S.S.settimana === iso(lunedi());\n\n  return `\n  <div class=\"settimana-barra\">\n    <button class=\"nav\" data-sett=\"-1\" aria-label=\"Settimana precedente\">‹</button>\n    <button c
