# Configurazione di Cloudflare Pages.
# Il nome del progetto deve coincidere con quello creato nel pannello.

name = "ferrafoni-home-planner"
pages_build_output_dir = "public"
compatibility_date = "2026-01-01"

# Il database D1. Il database_id lo dà Cloudflare quando crei il database:
#   npx wrangler d1 create ferrafoni-casa
[[d1_databases]]
binding = "DB"
database_name = "ferrafoni-casa"
database_id = "METTI-QUI-L-ID-CHE-TI-DA-CLOUDFLARE"

# La chiave di casa non va scritta qui: si imposta nel pannello di Cloudflare
# oppure con:  npx wrangler pages secret put CASA_CHIAVE
